<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강안교육 만족도 조사 - 시스템 점검 중</title>
<style>
  body {
    font-family: -apple-system, system-ui, 'Pretendard', sans-serif;
    margin: 0; padding: 24px;
    background: #f7f6f1;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    color: #1a1a1a;
  }
  .card {
    background: #fff; border: 1px solid #e6e3d8;
    border-radius: 12px; padding: 40px 32px;
    max-width: 480px; width: 100%;
    box-shadow: 0 6px 24px rgba(0,0,0,0.04);
    text-align: center;
  }
  .icon { font-size: 56px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 14px; }
  .desc {
    font-size: 14px; color: #4a4a48; line-height: 1.7;
    margin-bottom: 24px;
    background: #fff7e6; border-left: 3px solid #d97706;
    padding: 14px 18px; border-radius: 6px; text-align: left;
  }
  .alt-link {
    background: #1f3864; color: #fff;
    padding: 14px 24px; border-radius: 8px;
    font-size: 15px; font-weight: 600;
    text-decoration: none; display: inline-block;
    margin-bottom: 12px;
  }
  .alt-link:hover { background: #142850; }
  .meta { font-size: 12px; color: #8a8a84; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⏸</div>
    <h1>잠시 점검 중입니다</h1>
    <div class="desc">
      만족도 조사 시스템 일시 점검 중입니다.<br>
      <b>방송 안내에 따라 잠시 후 다시 시도해주세요.</b><br><br>
      또는 아래 임시 링크로 응답 부탁드립니다:
    </div>

    <!-- 보스가 GitHub에서 이 부분 URL만 바꾸면 됩니다 -->
    <a class="alt-link" href="https://docs.google.com/forms/d/_GOOGLE_FORM_URL_HERE_" target="_blank">
      👉 임시 응답 링크 (Google 폼)
    </a>

    <div class="meta">
      문제가 지속되면 담임선생님께 알려주세요.<br>
      강안교육
    </div>
  </div>
</body>
</html>
