// 🧪 테스트용 가상 회차 — 시스템 검증용
// ============================================================
window.createMockPeriod = function() {
  const periodId = document.getElementById('mock_period_id').value.trim();
  const periodLabel = document.getElementById('mock_period_label').value.trim();
  const count = parseInt(document.getElementById('mock_count').value) || 100;

  const err = validatePeriodId(periodId);
  if (err) { toast(err); return; }
  if (!periodLabel) { toast('회차 라벨을 입력하세요'); return; }
  if (count < 10 || count > 1000) { toast('응답 수는 10~1000 사이여야 합니다'); return; }

  if (window.SURVEYS[periodId]) {
    if (!confirm(`'${periodId}' 회차가 이미 있습니다. 덮어쓰시겠습니까?`)) return;
  }

  const baseData = window.SURVEYS[window.CURRENT_PERIOD_ID];
  if (!baseData) { toast('기준 데이터(현재 회차)가 없습니다'); return; }

  const cloned = JSON.parse(JSON.stringify(baseData));
  const noise = () => (Math.random() - 0.5) * 0.6;
  const clamp = (v) => Math.max(1, Math.min(5, v));

  cloned.meta = {
    period: periodLabel,
    period_id: periodId,
    n_target: count,
    n_total: count,
    submitted_at: new Date().toISOString(),
    overall_score: clamp(baseData.meta.overall_score + noise()),
  };
  if (cloned.sections) {
    cloned.sections.forEach(s => {
      s.avg = clamp(s.avg + noise());
      s.n = Math.floor(count * 0.9);
      if (s.details) {
        Object.keys(s.details).forEach(k => { s.details[k] = clamp(s.details[k] + noise()); });
      }
    });
  }
  if (cloned.teachers) {
    cloned.teachers.forEach(t => {
      t.overall = clamp(t.overall + noise());
      ['수업운영','질문답변','P/F테스트','과제관리','학습상담','피드백','교재'].forEach(k => {
        if (t[k] != null) t[k] = clamp(t[k] + noise());
      });
    });
  }
  if (cloned.homerooms) {
    cloned.homerooms.forEach(h => {
      h.overall = clamp(h.overall + noise());
      ['성적관리','정서관리'].forEach(k => { if (h[k] != null) h[k] = clamp(h[k] + noise()); });
    });
  }
  if (cloned.haksa && cloned.haksa.list) {
    cloned.haksa.list.forEach(h => {
      h.overall = clamp(h.overall + noise());
      if (h.scores) {
        Object.keys(h.scores).forEach(k => { h.scores[k] = clamp(h.scores[k] + noise()); });
      }
    });
    cloned.haksa.avg = clamp(cloned.haksa.avg + noise());
    cloned.haksa.overall = cloned.haksa.avg;
  }

  registerNewPeriod(periodId, periodLabel, cloned);
  toast(`✅ 가상 회차 '${periodLabel}' 생성 완료 (응답 ${count}건 시뮬, 분석 자동)`);

  document.getElementById('mock_period_id').value = '';
  document.getElementById('mock_period_label').value = '';
};

// === 엑셀 다운로드 헬퍼 ===
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}
function downloadXlsx(sheets, filename) {
  // sheets = [{name, rows: [{col1:val1, col2:val2}]}]
  if (typeof XLSX === 'undefined') {
    toast('엑셀 라이브러리 로딩 중. 잠시 후 다시 시도해주세요.');
    return;
  }
  const wb = XLSX.utils.book_new();
  sheets.forEach(s => {
    const ws = XLSX.utils.json_to_sheet(s.rows);
    // 컬럼 너비 자동 조정
    if (s.rows.length > 0) {
      const cols = Object.keys(s.rows[0]).map(k => {
        const maxLen = Math.max(k.length, ...s.rows.map(r => String(r[k] ?? '').length));
        return { wch: Math.min(Math.max(maxLen + 2, 10), 60) };
      });
      ws['!cols'] = cols;
    }
    XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0, 30));
  });
  XLSX.writeFile(wb, filename);
  toast(`${filename} 다운로드 완료`);
}

// ===== 학생 응답 원본(raw) 데이터 다운로드 =====
// 우선순위: 1) Firebase에서 실제 응답 가져오기  2) 없으면 임베딩된 시제품 raw 다운
window.dlRawData = async function() {
  try {
    // Firebase 초기화 대기 (최대 8초)
    let waited = 0;
    while (typeof window.__firestoreFetchAllResponses !== 'function' && waited < 8000) {
      if (waited === 0) toast('Firebase 연결 확인 중...');
      await new Promise(r => setTimeout(r, 300));
      waited += 300;
    }
    // 1) Firebase에서 응답 가져오기 시도
    if (typeof window.__firestoreFetchAllResponses === 'function') {
      toast('Firebase에서 학생 응답 가져오는 중...');
      const responses = await window.__firestoreFetchAllResponses();
      if (responses && responses.length > 0) {
        // SheetJS로 엑셀 생성
        await dlFirebaseResponsesAsXlsx(responses);
        return;
      }
      // Firebase에 응답 없음 → fallback to embedded raw
      toast('Firebase에 응답이 없습니다. 시제품 raw 데이터를 다운로드합니다.');
    } else {
      toast('Firebase 연결 안됨. 시제품 raw 데이터를 다운로드합니다.');
    }
    // 2) 임베딩된 raw 엑셀 (시제품 fallback)
    const b64 = window.__RAW_XLSX_B64__;
    if (!b64 || b64.length < 100) {
      toast('원본 데이터가 없습니다.');
      return;
    }
    const byteString = atob(b64);
    const bytes = new Uint8Array(byteString.length);
    for (let i = 0; i < byteString.length; i++) bytes[i] = byteString.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const period = (D.meta.period || '현재').replace(/[^가-힣A-Za-z0-9]/g, '_');
    a.download = `학생응답_원본_${period}_시제품.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('학생 응답 원본 (시제품) 다운로드 완료');
  } catch (e) {
    toast('다운로드 실패: ' + e.message);
    console.error(e);
  }
};

// Firebase 응답들을 SheetJS로 엑셀 변환 후 다운로드
async function dlFirebaseResponsesAsXlsx(responses) {
  // SheetJS 동적 로드
  if (typeof XLSX === 'undefined') {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('SheetJS 로드 실패'));
      document.head.appendChild(s);
    });
  }
  // 응답 평탄화
  const rows = responses.map((r, idx) => {
    const flat = {
      'No': idx + 1,
      '제출시각': r.submittedAt || r.serverTimestamp || '',
      '분기키': r.surveyKey || '',
      '학생ID': r.studentId || '',
      '학생이름': r.studentName || '',
      '학생타입': r.meta?.type || '',
      '성별': r.meta?.gender || '',
    };
    // 응답 답변들 평탄화 (questions, answers 안의 모든 값)
    if (r.answers && typeof r.answers === 'object') {
      Object.keys(r.answers).forEach(k => {
        flat['답변_' + k] = JSON.stringify(r.answers[k]);
      });
    }
    if (r.questions && typeof r.questions === 'object') {
      Object.keys(r.questions).forEach(k => {
        flat['질문_' + k] = String(r.questions[k]);
      });
    }
    // 기타 모든 키 (meta 제외)
    Object.keys(r).forEach(k => {
      if (['submittedAt','serverTimestamp','surveyKey','studentId','studentName','meta','answers','questions','_id'].includes(k)) return;
      flat[k] = typeof r[k] === 'object' ? JSON.stringify(r[k]) : r[k];
    });
    return flat;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '학생응답');
  const period = (D.meta.period || '현재').replace(/[^가-힣A-Za-z0-9]/g, '_');
  const fname = `학생응답_원본_${period}_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fname);
  toast(`Firebase 응답 ${responses.length}건 다운로드 완료`);
}

window.dlFeedbackHistory = function() {
  const all = loadFeedbacks();
  const out = [];
  Object.keys(all).forEach(id => {
    (all[id] || []).forEach((fb, i) => {
      // id 파싱: teacher_xxx, homeroom_xxx, haksa_xxx, dept_xxx
      const [type, ...nameParts] = id.split('_');
      const name = nameParts.join('_');
      const kindMap = { teacher: '강사', homeroom: '담임', haksa: '학사', dept: '부서', special: '특강' };
      out.push({
        대상_구분: kindMap[type] || type,
        대상_이름: name,
        번호: i+1,
        작성자: fb.author || '대표',
        발송방법: fb.method || '대면',
        작성일시: new Date(fb.timestamp).toLocaleString('ko-KR'),
        피드백내용: fb.text,
      });
    });
  });
  out.sort((a, b) => b.작성일시.localeCompare(a.작성일시));
  downloadXlsx([{ name: '피드백 히스토리', rows: out }], `강안교육_피드백히스토리_${todayStr()}.xlsx`);
};

let __TEACHER_SUBJECT_FILTER = '전체';
let __TEACHER_ASSIGNEE_FILTER = '전체';

function renderTeachersTable() {
  // 과목 그룹핑 (6과목)
  const subjects = ['전체', '국어', '영어', '수학', '탐구', '논술', '기초특강'];
  // 담당자 목록 추출
  const assigneeSet = new Set();
  D.teachers.forEach(t => assigneeSet.add(getAssignee(t.teacher, '수업운영팀장') || '미지정'));
  const assignees = ['전체', ...Array.from(assigneeSet).sort()];

  let filteredTeachers = D.teachers;
  if (__TEACHER_SUBJECT_FILTER !== '전체') {
    filteredTeachers = filteredTeachers.filter(t => (t.subject || ASSIGNEES_SUBJECT[t.teacher]) === __TEACHER_SUBJECT_FILTER);
  }
  if (__TEACHER_ASSIGNEE_FILTER !== '전체') {
    filteredTeachers = filteredTeachers.filter(t => getAssignee(t.teacher, '수업운영팀장') === __TEACHER_ASSIGNEE_FILTER);
  }
  // 과목별 카운트
  const subjectCount = {};
  D.teachers.forEach(t => {
    const s = t.subject || (t.subject || ASSIGNEES_SUBJECT[t.teacher] || '기타');
    subjectCount[s] = (subjectCount[s] || 0) + 1;
  });
  // 담당자별 카운트
  const assigneeCount = {};
  D.teachers.forEach(t => {
    const a = getAssignee(t.teacher, '수업운영팀장') || '미지정';
    assigneeCount[a] = (assigneeCount[a] || 0) + 1;
  });

  return `
    <div class="alert-info">
      <b>표본 30명 미만 강사</b>는 평균값보다 정성평가(자유응답)를 우선 검토해 주십시오.
    </div>
    <div class="subtabs" style="margin-top:0;">
      ${subjects.map(s => {
        const count = s === '전체' ? D.teachers.length : (subjectCount[s] || 0);
        return `<button class="subtab ${__TEACHER_SUBJECT_FILTER === s ? 'active' : ''}" onclick="__TEACHER_SUBJECT_FILTER='${s}'; renderInstructors(document.getElementById('main'));">${s} (${count})</button>`;
      }).join('')}
    </div>
    <div class="subtabs" style="margin-top:8px;">
      <span style="font-size:11.5px; color:var(--ink-3); font-weight:600; align-self:center; margin-right:6px;">담당자:</span>
      ${assignees.map(a => {
        const count = a === '전체' ? D.teachers.length : (assigneeCount[a] || 0);
        return `<button class="subtab ${__TEACHER_ASSIGNEE_FILTER === a ? 'active' : ''}" onclick="__TEACHER_ASSIGNEE_FILTER='${a}'; renderInstructors(document.getElementById('main'));">${escapeHtml(a)} (${count})</button>`;
      }).join('')}

  const comments = t.comments || [];

  // 모달 열 때마다 반 필터 초기화 (전체로)

  sessionStorage.removeItem('class_filter_' + safeName0);

          // 선별 상태 분리

          const excluded = [];
          comments.forEach((c, idx) => {
            if (isCmtExcluded(targetId, idx)) excluded.push({ c, idx });
            else included.push({ c, idx });
          });
          // 시제품: 각 응답에 가상의 반 번호·분기 부여 (실제는 raw에서 옴)
          const numClasses = (t.classes || []).length || 1;
          const assignClass = (idx) => 0;
          // 선별된 것은 펼쳐서, 제외된 것은 [더보기]로 접기
          // 확정 정보 + 권한 체크
          const confirmInfo = getSelConfirmation(targetId);
          const isConfirmed = confirmInfo && confirmInfo.confirmed && !confirmInfo.modified;
          const canEdit = canEditSelection(t.teacher);

          return `
            <!-- 선별 (포함된) 응답 - 위에 펼쳐서 -->
            <div class="cmt-section-h include">✓ 선별 (${included.length}건) — 보고서·메시지에 포함${isConfirmed ? ' <span style="font-size:10px; color:var(--good); font-weight:700;">[확정됨]</span>' : ''}</div>

            <!-- 제외된 응답 - [더보기]로 접기 -->

                  <div style="font-size: 11px; color: var(--ink-3); margin-bottom: 8px; font-style: italic;">제외된 응답입니다. 다시 ✓ 포함 클릭하면 보고서에 들어갑니다.</div>
                  ${excluded.map(({ c, idx }) => `
                    <div class="cmt excluded" data-target-id="${escapeHtml(targetId)}" data-idx="${idx}" data-class="${assignClass(idx)}">
                      <div class="cmt-text">${numClasses >= 2 ? `<span style="font-size:10px; color:var(--ink-3); background:var(--bg); padding:1px 5px; border-radius:3px; margin-right:4px;">${assignClass(idx)}반</span>` : ''}${escapeHtml(c)}</div>

                      </div>
                    </div>
                  `).join('')}
                </div>
              </details>
            ` : ''}
          `;
        })()}
        </div>
      </div>

      <!-- 피드백 작성 폼 (편집 가능) -->

      ${(() => {

                    </div>
                    <div style="font-size: 12px; color: var(--ink-2); line-height: 1.6; white-space: pre-wrap;">${formatFbBody(fb)}</div>
                  </div>
                `).join('')}
              </div>
            </details>
          </div>
        `;
      })()}

      <!-- 확정 전달용 메시지 (강사에게 보낼 공식 메시지) -->
      <div style="margin-top: 14px; padding: 14px 16px; background: #eff6ff; border-radius: 7px; border-left: 4px solid #3b82f6;">

          <span style="font-size:11px; color:var(--ink-3); font-weight:500;">강사에게 보낼 공식 메시지 (메일·카톡 복사용)</span>

        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">닫기</button>

window.sendToHaksa = function(name) {
  const total = document.querySelectorAll('#modalBody .cmt').length;
  const excluded = document.querySelectorAll('#modalBody .cmt.excluded').length;
  const sent = total - excluded;
  closeModal();
  toast(`${name} 학사장님께 ${sent}건 전송 완료 (제외 ${excluded}건) `);
};

// ===== 선별 → 피드백 작성 연동 =====
// 모달에서 ✓로 선택된 코멘트를 자동으로 피드백 본문에 첨부하여 피드백 모달 오픈
window.goToFeedbackWithComments = function(targetId, targetName, kind, meta) {
  const selectedComments = [];
  document.querySelectorAll('#modalBody .cmt').forEach(el => {
    if (!el.classList.contains('excluded')) {
      const text = el.querySelector('.cmt-text');
      if (text) selectedComments.push(text.textContent);
    }
  });
  closeModal();
  // 약간의 딜레이 후 피드백 모달 오픈
  setTimeout(() => {
    openFeedbackModal(targetId, targetName, kind, meta);
    // 텍스트 영역에 선별된 코멘트 미리 채워넣기
    setTimeout(() => {
      const ta = document.getElementById('fbText');
      if (ta && selectedComments.length > 0) {
        const intro = `[학생 자유응답 ${selectedComments.length}건 전달]\n\n`;
        const body = selectedComments.map((c, i) => `${i+1}. "${c}"`).join('\n\n');
        const closing = `\n\n[원장 의견]\n`;
        ta.value = intro + body + closing;
        ta.focus();
        // 커서를 [원장 의견] 다음에 위치
        ta.setSelectionRange(ta.value.length, ta.value.length);
      }
    }, 100);
  }, 200);
};

window.toggleCmt = function(btn, isYes) {
  const cmt = btn.closest('.cmt');
  const targetId = cmt.getAttribute('data-target-id');
  const idx = parseInt(cmt.getAttribute('data-idx'));
  // 권한 체크 - 담당자만 또는 admin
  const targetName = targetId ? getTargetNameFromId(targetId) : null;
  if (targetName && !canEditSelection(targetName)) {
    toast(`선별 권한이 없습니다. 이 대상의 담당자(${getAssignee(targetName, '담당자')})만 변경 가능합니다.`);
    return;
  }
  const yesBtn = cmt.querySelector('.cmt-btn:nth-child(1)');
  const noBtn = cmt.querySelector('.cmt-btn:nth-child(2)');
  if (isYes) { yesBtn.classList.add('on-yes'); noBtn.classList.remove('on-no'); cmt.classList.remove('excluded'); }
  else { yesBtn.classList.remove('on-yes'); noBtn.classList.add('on-no'); cmt.classList.add('excluded'); }
  // "변경됨" 표시 (확정 후 토글된 경우)
  const conf = getSelConfirmation(targetId);
  if (conf && conf.confirmed) {
    cmt.classList.add('changed-after-confirm');
  }
  // 영구 저장
  if (targetId && !isNaN(idx)) {
    setCmtExcluded(targetId, idx, !isYes);
  }
  refreshCmtCounter();
  // 확정 배지가 있다면 "수정 중"으로 갱신
  const badge = document.getElementById('selConfirmBadge');
  if (badge && targetId) {
    badge.innerHTML = renderSelConfirmBadge(targetId);
  }
};

// targetId에서 대상 이름 추출
function getTargetNameFromId(targetId) {
  if (!targetId) return null;
  if (targetId.startsWith('teacher_')) return targetId.slice('teacher_'.length);
  if (targetId.startsWith('homeroom_')) return targetId.slice('homeroom_'.length);
  if (targetId.startsWith('haksa_')) return targetId.slice('haksa_'.length);
  if (targetId.startsWith('dept_')) return targetId.slice('dept_'.length).split('_')[0];
  return null;
}

// 현재 사용자가 이 대상의 선별을 수정할 수 있는지
function canEditSelection(targetName) {
  if (!currentUser) return false;
  if (currentUser.role === 'admin') return true;
  return isAssignedTo(targetName, currentUser);
}

function refreshCmtCounter() {
  const allCmt = document.querySelectorAll('#modalBody .cmt');
  if (allCmt.length === 0) return;
  const total = allCmt.length;
  const excluded = document.querySelectorAll('#modalBody .cmt.excluded').length;
  const included = total - excluded;
  const counter = document.getElementById('cmtCounter');
  if (counter) {
    counter.innerHTML = `<span class="inc">선별 <b>${included}건</b></span> · <span class="exc">제외 <b>${excluded}건</b></span> · 전체 <b>${total}건</b>`;
  }
}

// === 강사 확정 전달용 메시지 ===
function getTeacherMessage(template, t) {
  const settings = loadSettings();
  const period = settings.period.label;
  const score = t.overall.toFixed(2);
  const subject = (t.subject || ASSIGNEES_SUBJECT[t.teacher] || '');
  // 과목 내 순위
  const sameSubj = D.teachers
    .filter(x => (x.subject || ASSIGNEES_SUBJECT[x.teacher] || '기타') === (subject || '기타'))
    .slice().sort((a, b) => b.overall - a.overall);
  const rank = sameSubj.findIndex(x => x.teacher === t.teacher) + 1;
  const total = sameSubj.length;

  const templates = {
    standard:
`${t.teacher} 선생님,

안녕하세요. ${period} 만족도 조사 결과를 전달드립니다.

▸ 종합 점수: ${score} / 5.00
▸ 학생수: ${t.n_students}명 / 응답 ${t.n_responses}건
▸ ${subject} 과목 내 순위: ${rank}위 / ${total}명

자세한 자유응답과 항목별 점수는 별도 파일로 전달드립니다.
질문 있으시면 언제든 말씀해 주세요.

감사합니다.`,

    praise:
`${t.teacher} 선생님,

${period} 만족도 조사에서 ${score}점이라는 우수한 결과를 받으셨습니다.
${subject} 과목 ${total}명 중 ${rank}위 — 진심으로 축하드립니다.

선생님의 노고와 열정이 학생들에게 그대로 전달되고 있다는 증거입니다.
다음 분기에도 좋은 모습 부탁드립니다.

감사합니다.`,

    caution:
`${t.teacher} 선생님,

${period} 만족도 조사 결과 종합 ${score}점을 받으셨습니다.
${score < 4.0 ? '학원 평균 대비 보완이 필요한 영역이 확인되었습니다.' : '아쉽게도 일부 영역에서 학생 의견이 모인 부분이 있습니다.'}

자유응답을 함께 검토해 주시고, 필요 시 면담 요청 드리겠습니다.
선생님의 솔직한 피드백을 부탁드립니다.

감사합니다.`,

    meeting:
`${t.teacher} 선생님,

${period} 만족도 조사 결과 관련하여 면담을 요청드립니다.

▸ 종합 점수: ${score} / 5.00
▸ ${subject} 과목 내: ${rank}위 / ${total}명

다음 주 중 가능하신 시간을 알려주시면 일정 잡겠습니다.
편한 시간 회신 부탁드립니다.

감사합니다.`,

    renewal:
`${t.teacher} 선생님,

${period} 만족도 조사를 마무리하며 다음 분기 재계약 관련 안내드립니다.

▸ 종합 점수: ${score} / 5.00
▸ ${subject} 과목 ${rank}위 / ${total}명
${score >= 4.6 ? '▸ 우수 평가 — 재계약 우대 검토 중' : score >= 4.4 ? '▸ 안정 평가 — 재계약 진행 예정' : score >= 4.0 ? '▸ 보통 평가 — 면담 후 결정' : '▸ 면담 필수'}

상세 논의는 별도 일정에서 진행하겠습니다.

감사합니다.`
  };
  return templates[template] || templates.standard;
}

window.updateTeacherMessage = function(name) {
  const t = D.teachers.find(x => x.teacher === name);
  if (!t) return;
  const safeName = name.replace(/[^a-zA-Z가-힣0-9]/g, '_');
  const sel = document.getElementById('msgTemplate_' + safeName);
  const body = document.getElementById('msgBody_' + safeName);
  if (sel && body) body.value = getTeacherMessage(sel.value, t);
};

window.copyTeacherMessage = function(name) {
  const safeName = name.replace(/[^a-zA-Z가-힣0-9]/g, '_');
  const body = document.getElementById('msgBody_' + safeName);
  if (!body) return;
  body.select();
  body.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(body.value).then(() => {
    toast('복사됨 — 메일·카톡에 붙여넣기 하세요');
  }).catch(() => {
    document.execCommand('copy');
    toast('복사됨');
  });
};

window.sendTeacherMessageMail = function(name) {
  const safeName = name.replace(/[^a-zA-Z가-힣0-9]/g, '_');
  const body = document.getElementById('msgBody_' + safeName);
  if (!body) return;
  const settings = loadSettings();
  const subject = `[강안교육] ${settings.period.label} 만족도 결과 - ${name} 선생님`;
  const mailto = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body.value)}`;
  window.location.href = mailto;
};

// === 분기 범위 변경 - 차트 다시 그리기 ===
// === 분기 선택 (다중 선택 가능) ===
// 기본: 전체 선택. 선택된 인덱스 배열을 sessionStorage에 저장.
function getPeriodSelection(teacherName) {
  const safeName = teacherName.replace(/[^a-zA-Z가-힣0-9]/g, '_');
  const stored = sessionStorage.getItem('period_sel_' + safeName);
  if (stored) {
    try { return JSON.parse(stored); } catch {}
  }
  // 기본: 전체 선택
  return PERIODS.map((_, i) => i);
}

function savePeriodSelection(teacherName, indices) {
  const safeName = teacherName.replace(/[^a-zA-Z가-힣0-9]/g, '_');
  sessionStorage.setItem('period_sel_' + safeName, JSON.stringify(indices));
}

window.togglePeriod = function(teacherName, periodIdx) {
  // 미래 분기는 토글 불가 (데이터 없음)
  if (PERIODS[periodIdx] && PERIODS[periodIdx].future) {
    toast('아직 진행되지 않은 분기입니다');
    return;
  }
  let sel = getPeriodSelection(teacherName);
  if (sel.includes(periodIdx)) {
    // 해제 시도 - 마지막 1개는 해제 불가 (최소 1개는 있어야 함)
    if (sel.length === 1) {
      toast('최소 1개 분기는 선택되어 있어야 합니다');
      return;
    }
    sel = sel.filter(i => i !== periodIdx);
  } else {
    sel.push(periodIdx);
  }
  sel.sort((a, b) => a - b);
  savePeriodSelection(teacherName, sel);
  refreshPeriodSelector(teacherName);
};

window.setPeriodSelection = function(teacherName, mode) {
  let sel;
  const currentIdx = PERIODS.findIndex(p => p.isCurrent);
  if (mode === 'all') sel = PERIODS.map((_, i) => i);
  else if (mode === 'current') sel = [currentIdx];
  else if (mode === 'recent3') sel = PERIODS.slice(-3).map((_, i) => PERIODS.length - 3 + i);
  else if (mode === 'recent6') sel = PERIODS.slice(-6).map((_, i) => Math.max(0, PERIODS.length - 6) + i);
  else sel = [currentIdx];
  // 빈 선택 방지
  if (sel.length === 0) sel = [currentIdx];
  sel.sort((a, b) => a - b);
  savePeriodSelection(teacherName, sel);
  refreshPeriodSelector(teacherName);
};

function refreshPeriodSelector(teacherName) {
  const safeName = teacherName.replace(/[^a-zA-Z가-힣0-9]/g, '_');
  const sel = getPeriodSelection(teacherName);
  // 버튼 색상 갱신
  const container = document.getElementById('periodSelector_' + safeName);
  if (container) {
    container.querySelectorAll('button[data-period-idx]').forEach(btn => {
      const idx = parseInt(btn.getAttribute('data-period-idx'));
      const isOn = sel.includes(idx);
      const isCurrent = PERIODS[idx].isCurrent;
      if (isOn && isCurrent) {
        // 선택됨 + 현재 = 진한 파랑
        btn.style.background = 'var(--accent)';
        btn.style.color = '#fff';
        btn.style.borderColor = 'var(--accent)';
      } else if (isOn) {
        // 선택됨 + 과거 = 연한 파랑
        btn.style.background = 'var(--accent-soft)';
        btn.style.color = 'var(--accent)';
        btn.style.borderColor = 'var(--accent)';
      } else if (isCurrent) {
        // 해제됨 + 현재 = 흰 배경 + 회색 점선 (현재인데 안 봄을 표시)
        btn.style.background = '#fff';
        btn.style.color = 'var(--ink-3)';
        btn.style.borderColor = 'var(--line-2)';
        btn.style.borderStyle = 'dashed';
      } else {
        // 해제됨 + 과거 = 흰 배경
        btn.style.background = '#fff';
        btn.style.color = 'var(--ink-3)';
        btn.style.borderColor = 'var(--line-2)';
        btn.style.borderStyle = 'solid';
      }
    });
  }
  // 차트 갱신
  const chartBox = document.getElementById('trendChartBox_' + safeName);
  if (chartBox) {
    const teacher = D.teachers.find(t => t.teacher === teacherName);
    if (teacher) {
      const history = generateHistory(teacher.overall);
      chartBox.innerHTML = renderSelectedPeriodChart(history, OVERALL_HISTORY, PERIODS, sel, teacherName);
    } else {
      // 담임 찾기
      const homeroom = D.homerooms && D.homerooms.find(x => x.teacher === teacherName);
      if (homeroom) {
        const history = generateHistory(homeroom.overall);
        chartBox.innerHTML = renderSelectedPeriodChartGeneric(history, OVERALL_HISTORY, PERIODS, sel, teacherName, ['성적관리', '정서관리'], homeroom);
      } else {
        // 학사 찾기
        const haksa = D.haksa && D.haksa.list && D.haksa.list.find(x => x.name === teacherName);
        if (haksa) {
          const history = generateHistory(haksa.overall);
          const haksaItems = ['아침식사', '기상관리', '셔틀정숙', '휴대폰관리', '학사복귀후관리', '청소빨래'].filter(k => haksa[k] !== undefined);
          chartBox.innerHTML = renderSelectedPeriodChartGeneric(history, OVERALL_HISTORY, PERIODS, sel, teacherName, haksaItems, haksa);
        } else {
          // 부서 (급식·교무·매일깨기·한국사) 찾기 - window._deptModalContext
          const deptCtx = window._deptModalContext && window._deptModalContext[teacherName];
          if (deptCtx) {
            const history = generateHistory(deptCtx.overall);
            chartBox.innerHTML = renderSelectedPeriodChartGeneric(history, OVERALL_HISTORY, PERIODS, sel, teacherName, deptCtx.items, deptCtx.obj);
          }
        }
      }
    }
  }
  // 항목별 점수·자유응답 갱신 (강사만 - 담임·학사·부서는 모달 내부에서 처리 안 함, 차트만)
  if (D.teachers.find(t => t.teacher === teacherName)) {
    refreshTeacherDetails(teacherName);
  }
}

// 현재 보고 있는 반 (0 = 전체)
function getClassFilter(teacherName) {
  const safeName = teacherName.replace(/[^a-zA-Z가-힣0-9]/g, '_');
  const stored = sessionStorage.getItem('class_filter_' + safeName);
  return stored ? parseInt(stored) : 0;
}

window.selectClass = function(teacherName, classNum) {
  const safeName = teacherName.replace(/[^a-zA-Z가-힣0-9]/g, '_');
  const current = getClassFilter(teacherName);
  // 같은 걸 다시 클릭 = 전체로 돌아감
  const newFilter = (current === classNum && classNum !== 0) ? 0 : classNum;
  sessionStorage.setItem('class_filter_' + safeName, String(newFilter));
  // 버튼 색상 갱신
  const container = document.getElementById('classSelector_' + safeName);
  if (container) {
    container.querySelectorAll('button[data-class-num]').forEach(btn => {
      const num = parseInt(btn.getAttribute('data-class-num'));
      const divs = btn.querySelectorAll('div');
      if (num === newFilter) {
        btn.style.background = 'var(--accent)';
        btn.style.color = '#fff';
        btn.style.borderColor = 'var(--accent)';
        divs.forEach(d => { d.style.color = '#fff'; });
      } else {
        btn.style.background = '#fff';
        btn.style.color = '';
        btn.style.borderColor = 'var(--line)';
        // 모든 라벨 색상 복원
        if (divs[0]) divs[0].style.color = 'var(--ink-3)';
        if (divs[1]) {
          const score = parseFloat(divs[1].innerText);
          divs[1].style.color = (num !== 0 && score < D.meta.overall_score) ? 'var(--danger)' : 'var(--ink)';
        }
        if (divs[2]) divs[2].style.color = 'var(--ink-3)';
      }
    });
  }
  refreshTeacherDetails(teacherName);
};

// 분기·반 필터에 따른 강사 상세 갱신 (항목별 점수·자유응답 헤더·자유응답 리스트)
function refreshTeacherDetails(teacherName) {
  const safeName = teacherName.replace(/[^a-zA-Z가-힣0-9]/g, '_');
  const teacher = D.teachers.find(t => t.teacher === teacherName);
  if (!teacher) return;
  const classFilter = getClassFilter(teacherName);
  const periodSel = getPeriodSelection(teacherName);
  const isCurrentOnly = periodSel.length === 1 && PERIODS[periodSel[0]].isCurrent;
  const isPastSingle = periodSel.length === 1 && !PERIODS[periodSel[0]].isCurrent;
  const includesCurrent = periodSel.some(i => PERIODS[i].isCurrent);
  // 분기 칩 라벨 함수
  const buildPeriodChip = () => {
    if (isCurrentOnly) {
      return `<span style="font-size:12px; padding:4px 10px; background:var(--accent-soft); color:var(--accent); border-radius:14px; font-weight:600;">📅 현재 분기</span>`;
    }
    if (isPastSingle) {
      // 과거 1개 선택 - 분기 이름 표시
      return `<span style="font-size:12px; padding:4px 10px; background:#fff5f0; color:#b8540a; border-radius:14px; font-weight:700;">📅 ${escapeHtml(PERIODS[periodSel[0]].label)}</span>`;
    }
    // 여러 개 선택
    const suffix = includesCurrent ? '' : ' (과거만)';
    return `<span style="font-size:12px; padding:4px 10px; background:var(--accent); color:#fff; border-radius:14px; font-weight:600;">📅 ${periodSel.length}개 분기 평균${suffix}</span>`;
  };
  const numClasses = (teacher.classes || []).length || 1;
  const studentsPerClass = Math.round(teacher.n_students / Math.max(1, numClasses));
  const classes = window['_teacherClassData_' + safeName] || [];
  // 평균 계산: 선택된 분기들 평균 + 반 필터
  let displayedScore = teacher.overall;
  let displayedN = teacher.n_students;
  let displayedRespN = teacher.n_responses;
  if (classFilter !== 0 && classes[classFilter - 1]) {
    displayedScore = classes[classFilter - 1].score;
    displayedN = classes[classFilter - 1].n;
    displayedRespN = Math.round(teacher.n_responses * displayedN / teacher.n_students);
  }
  // 분기 평균 적용 (선택된 분기들의 평균치를 현재 점수에 반영)
  if (!isCurrentOnly) {
    const history = generateHistory(teacher.overall);
    const avgScore = periodSel.reduce((s, i) => s + history[i], 0) / periodSel.length;
    displayedScore = displayedScore - teacher.overall + avgScore; // 반 점수에 분기 차이 반영
  }
  // 헤더 칩 갱신 (항목별 점수)
  const header = document.getElementById('itemScoresHeader_' + safeName);
  if (header) {
    const periodChip = buildPeriodChip();
    const classChip = classFilter === 0
      ? `<span style="font-size:12px; padding:4px 10px; background:#f0f0eb; color:var(--ink-2); border-radius:14px; font-weight:600;">👥 전체 · ${teacher.n_students}명</span>`
      : `<span style="font-size:12px; padding:4px 10px; background:var(--accent); color:#fff; border-radius:14px; font-weight:700;">👥 ${classFilter}반만 · ${classes[classFilter-1]?.n || 0}명</span>`;
    header.innerHTML = periodChip + classChip;
  }
  // 항목별 점수 막대 갱신 (실제 분반 점수 + 피드백 ★ 배지)
  const bars = document.getElementById('itemScoresBars_' + safeName);
  if (bars) {
    const items = teacherScoreItems(teacher);
    let sourceScores = teacher;
    if (classFilter !== 0 && classes[classFilter - 1] && classes[classFilter - 1].scores) {
      sourceScores = classes[classFilter - 1].scores;
    }
    bars.innerHTML = items.map(k => {
      const val = (typeof sourceScores[k] === 'number') ? sourceScores[k] : (teacher[k] || 0);
      const isFeedback = (k === '피드백');
      const opacity = isFeedback ? 'opacity:0.55;' : '';
      const star = isFeedback ? '<span style="color:#d4a017; font-weight:700; margin-right:3px;" title="종합 점수에서 제외">★</span>' : '';
      const note = isFeedback ? '<span style="font-size:10px; color:var(--ink-3); margin-left:4px;">(종합 제외)</span>' : '';
      return `
        <div class="bar-row" style="grid-template-columns: 100px 1fr 50px;${isFeedback ? 'border-top:1px dashed var(--line); padding-top:8px; margin-top:6px;' : ''}">
          <div class="bar-label" style="font-size:13px;">${star}${k}${note}</div>
          <div class="bar-track" style="height:18px; ${opacity}"><div class="bar-fill ${gradeClass(val)}" style="width:${pct(val)}%; font-size:10.5px;">${val.toFixed(2)}</div></div>
          <div class="bar-score" style="font-size:13px;${opacity}">${val.toFixed(2)}</div>
        </div>
      `;
    }).join('');
  }
  // 자유응답 헤더 칩 갱신
  const cmtChips = document.getElementById('cmtHeaderChips_' + safeName);
  const allComments = teacher.comments || [];
  let visibleComments = allComments;
  if (classFilter !== 0 && numClasses >= 2 && teacher.classes && teacher.classes[classFilter - 1]) {
    const targetLabel = teacher.classes[classFilter - 1].label;
    visibleComments = allComments;
  }
  if (cmtChips) {
    const periodChip = buildPeriodChip();
    const classChip = classFilter === 0
      ? `<span style="font-size:12px; padding:4px 10px; background:#f0f0eb; color:var(--ink-2); border-radius:14px; font-weight:600;">👥 전체</span>`
      : `<span style="font-size:12px; padding:4px 10px; background:var(--accent); color:#fff; border-radius:14px; font-weight:700;">👥 ${classFilter}반만</span>`;
    const countChip = `<span style="font-size:12px; padding:4px 10px; background:var(--good-soft); color:var(--good); border-radius:14px; font-weight:600;">${visibleComments.length}건</span>`;
    cmtChips.innerHTML = periodChip + classChip + countChip;
  }
  // 자유응답 리스트의 각 cmt를 반 필터로 표시/숨김
  const cmtContainer = document.getElementById('cmtListContainer_' + safeName);
  if (cmtContainer) {
    cmtContainer.querySelectorAll('.cmt').forEach(cmtEl => {
      const cls = parseInt(cmtEl.getAttribute('data-class') || '0');
      if (classFilter === 0 || cls === classFilter) {
        cmtEl.style.display = '';
      } else {
        cmtEl.style.display = 'none';
      }
    });
    // 선별/제외 헤더 갱신 (보이는 것만 카운트)
    const visibleIncluded = Array.from(cmtContainer.querySelectorAll('.cmt:not(.excluded)')).filter(el => el.style.display !== 'none').length;
    const visibleExcluded = Array.from(cmtContainer.querySelectorAll('.cmt.excluded')).filter(el => el.style.display !== 'none').length;
    const includeHeader = cmtContainer.querySelector('.cmt-section-h.include');
    if (includeHeader) includeHeader.innerText = `✓ 선별 (${visibleIncluded}건) — 보고서·메시지에 포함`;
    const excludedSummary = cmtContainer.querySelector('details summary');
    if (excludedSummary && visibleExcluded >= 0) {
      const arrow = excludedSummary.querySelector('span');
      excludedSummary.innerHTML = `<span style="font-size: 11px; color: var(--ink-3);">▶</span> ✗ 제외된 응답 ${visibleExcluded}건 — 응답 더보기 (검토용)`;
    }
  }
}

function generateHistory(currentScore) {
  const out = [];
  for (let i = 0; i < PERIODS.length; i++) {
    if (PERIODS[i].id === window.CURRENT_PERIOD_ID) {
      out.push(currentScore);
    } else {
      out.push(null);
    }
  }
  return out;
}

function renderSelectedPeriodChart(history, overallHistory, periods, selectedIndices, teacherName) {
  // 미래 분기 자동 제외
  const validIndices = selectedIndices.filter(i =>
    periods[i] && !periods[i].future && overallHistory[i] != null && history[i] != null
  );
  if (validIndices.length === 0) {
    return '<div style="text-align: center; padding: 30px; color: var(--ink-3); font-size: 12px;">표시할 과거 분기 데이터가 없습니다.</div>';
  }
  const filtered = validIndices.map(i => ({
    period: periods[i],
    score: history[i],
    overall: overallHistory[i],
    idx: i,
  }));
  // 차트
  let chartHtml = '';
  if (filtered.length >= 2) {
    chartHtml = svgTrendChartFiltered(filtered, 1100, 130);
  } else {
    // 1개만 선택된 경우 큰 숫자로 표시
    const f = filtered[0];
    chartHtml = `
      <div style="text-align: center; padding: 30px 12px; background: #fff; border-radius: 6px;">
        <div style="font-size: 12px; color: var(--ink-3); font-weight: 600;">${escapeHtml(f.period.label)}${f.period.isCurrent ? ' (현재)' : ''}</div>
        <div style="font-size: 36px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; margin: 6px 0;">${f.score.toFixed(2)}</div>
        <div style="font-size: 11px; color: var(--ink-3);">학원 평균: ${f.overall.toFixed(2)} · 차이: ${(f.score - f.overall >= 0 ? '+' : '')}${(f.score - f.overall).toFixed(2)}</div>
      </div>
    `;
  }
  // 분기 라벨
  const labels = `<div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-3); margin-top:6px; padding: 0 8px; flex-wrap: wrap;">
    ${filtered.map(f => `<span>${escapeHtml(f.period.label)}${f.period.isCurrent ? '★' : ''}</span>`).join('')}
  </div>`;
  // 총점 표
  const table = `
    <table style="width:100%; margin-top: 12px; font-size: 11.5px; border-collapse: collapse;">
      <thead>
        <tr style="border-bottom: 1px solid var(--line); color: var(--ink-3);">
          <th style="text-align: left; padding: 5px 6px; font-weight: 600;">분기</th>
          <th style="text-align: center; padding: 5px 6px; font-weight: 600;">총점</th>
          <th style="text-align: center; padding: 5px 6px; font-weight: 600;">전분기 대비</th>
          <th style="text-align: center; padding: 5px 6px; font-weight: 600;">학원 평균 대비</th>
        </tr>
      </thead>
      <tbody>
        ${filtered.map((f, i) => {
          const prev = i > 0 ? filtered[i-1].score : null;
          const diff = prev !== null ? f.score - prev : null;
          const diffOverall = f.score - f.overall;
          return `
            <tr style="border-bottom: 1px dashed var(--line); ${f.period.isCurrent ? 'background: var(--accent-soft);' : ''}">
              <td style="padding: 6px;">${escapeHtml(f.period.label)}${f.period.isCurrent ? ' <b style="color:var(--accent);">(현재)</b>' : ''}</td>
              <td style="text-align: center; padding: 6px; font-weight: 700;">${f.score.toFixed(2)}</td>
              <td style="text-align: center; padding: 6px; color: ${diff === null ? 'var(--ink-3)' : (diff > 0 ? 'var(--good)' : (diff < 0 ? 'var(--danger)' : 'var(--ink-3)'))}">${diff === null ? '-' : (diff > 0 ? '+' : '') + diff.toFixed(2)}</td>
              <td style="text-align: center; padding: 6px; color: ${diffOverall > 0 ? 'var(--good)' : 'var(--danger)'}">${diffOverall > 0 ? '+' : ''}${diffOverall.toFixed(2)}</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;

  // 항목별 분기 추이 표 (teacherName 있고 분기 2개 이상일 때만)
  let itemTrendTable = '';
  if (teacherName && filtered.length >= 2) {
    const teacher = D.teachers.find(t => t.teacher === teacherName);
    if (teacher) {
      const items = teacherScoreItems(teacher);
      // 각 항목 × 각 분기 점수 시뮬 (현재 분기 기준 + 분기 차이만큼 항목별 가중 변동)
      const periodOffsets = filtered.map(f => f.score - teacher.overall);
      // 항목별 첫분기→마지막분기 변동
      const itemChanges = items.map(k => {
        const baseVal = teacher[k];
        // 항목마다 분기별 다른 변동 (시뮬: 항목 이름·분기 인덱스로 시드)
        const itemPeriodScores = filtered.map((f, i) => {
          const itemSeed = seededRand(teacher.teacher + '_' + k, f.idx);
          // 항목별 변동: 총점 변동 + 항목 고유 변동 (-0.2 ~ +0.2)
          const itemVar = (itemSeed - 0.5) * 0.4;
          return Math.max(2.5, Math.min(5.0, baseVal + periodOffsets[i] + itemVar));
        });
        const change = itemPeriodScores[itemPeriodScores.length - 1] - itemPeriodScores[0];
        return { name: k, scores: itemPeriodScores, change };
      });
      // 총점 변동
      const totalChange = filtered[filtered.length - 1].score - filtered[0].score;
      // 가장 떨어진 / 가장 오른 항목
      const worstItem = itemChanges.slice().sort((a, b) => a.change - b.change)[0];
      const bestItem = itemChanges.slice().sort((a, b) => b.change - a.change)[0];

      itemTrendTable = `
        <div style="margin-top: 18px; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 8px;">
          <h4 style="font-size: 13px; font-weight: 700; margin: 0 0 4px; color: var(--ink); display: flex; align-items: center; gap: 6px;">
            📋 항목별 분기 추이 <span style="font-size: 11px; color: var(--ink-3); font-weight: 500;">총점은 7개 항목 평균 · 어느 항목이 떨어졌는지 분석</span>
          </h4>
          <div style="font-size: 12px; color: var(--ink-2); margin: 8px 0 12px; padding: 8px 10px; background: var(--bg); border-radius: 5px; line-height: 1.6;">
            <div><b>총점 ${filtered[0].period.label} → ${filtered[filtered.length - 1].period.label}:</b> ${filtered[0].score.toFixed(2)} → ${filtered[filtered.length - 1].score.toFixed(2)} <span style="color: ${totalChange >= 0 ? 'var(--good)' : 'var(--danger)'}; font-weight: 700;">(${totalChange >= 0 ? '+' : ''}${totalChange.toFixed(2)})</span></div>
            <div style="margin-top: 4px;">
              가장 <span style="color: var(--good); font-weight: 700;">상승</span>: <b>${escapeHtml(bestItem.name)}</b> (${bestItem.change >= 0 ? '+' : ''}${bestItem.change.toFixed(2)}) · 
              가장 <span style="color: var(--danger); font-weight: 700;">하락</span>: <b>${escapeHtml(worstItem.name)}</b> (${worstItem.change >= 0 ? '+' : ''}${worstItem.change.toFixed(2)})
            </div>
          </div>
          <table style="width:100%; font-size: 11.5px; border-collapse: collapse;">
            <thead>
              <tr style="border-bottom: 1.5px solid var(--ink-2); color: var(--ink-2);">
                <th style="text-align: left; padding: 6px 8px; font-weight: 700;">항목</th>
                ${filtered.map(f => `<th style="text-align: center; padding: 6px 8px; font-weight: 700; ${f.period.isCurrent ? 'color: var(--accent);' : ''}">${escapeHtml(f.period.label)}${f.period.isCurrent ? '★' : ''}</th>`).join('')}
                <th style="text-align: center; padding: 6px 8px; font-weight: 700;">변동</th>
              </tr>
            </thead>
            <tbody>
              ${itemChanges.map(item => {
                const isWorst = item.name === worstItem.name && worstItem.change < 0;
                const isBest = item.name === bestItem.name && bestItem.change > 0;
                return `
                  <tr style="border-bottom: 1px dashed var(--line); ${isWorst ? 'background:#fff5f5;' : isBest ? 'background:#f4f9f6;' : ''}">
                    <td style="padding: 6px 8px; font-weight: ${isWorst || isBest ? '700' : '500'};">${escapeHtml(item.name)}${isWorst ? ' <span style="color:var(--danger); font-size:10px;">⚠️ 주의</span>' : isBest ? ' <span style="color:var(--good); font-size:10px;">✨ 강점</span>' : ''}</td>
                    ${item.scores.map((s, i) => {
                      const prevS = i > 0 ? item.scores[i-1] : null;
                      const dColor = prevS === null ? 'var(--ink)' : (s > prevS ? 'var(--good)' : (s < prevS ? 'var(--danger)' : 'var(--ink)'));
                      return `<td style="text-align: center; padding: 6px 8px; color: ${dColor}; font-weight: 600;">${s.toFixed(2)}</td>`;
                    }).join('')}
                    <td style="text-align: center; padding: 6px 8px; font-weight: 700; color: ${item.change > 0 ? 'var(--good)' : (item.change < 0 ? 'var(--danger)' : 'var(--ink-3)')};">${item.change > 0 ? '+' : ''}${item.change.toFixed(2)}</td>
                  </tr>
                `;
              }).join('')}
              <tr style="border-top: 1.5px solid var(--ink-2); background: var(--accent-soft);">
                <td style="padding: 8px; font-weight: 700; color: var(--accent);">총점 (평균)</td>
                ${filtered.map(f => `<td style="text-align: center; padding: 8px; font-weight: 700; color: var(--accent);">${f.score.toFixed(2)}</td>`).join('')}
                <td style="text-align: center; padding: 8px; font-weight: 700; color: ${totalChange > 0 ? 'var(--good)' : (totalChange < 0 ? 'var(--danger)' : 'var(--ink-3)')};">${totalChange > 0 ? '+' : ''}${totalChange.toFixed(2)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }
  }
  return chartHtml + table + itemTrendTable;
}

// === 범용 분기 추이 차트 (담임·학사·부서·급식 등) ===
// targetObj: 데이터 객체 (h, k 등) / itemKeys: 평가 항목 이름들
function renderSelectedPeriodChartGeneric(history, overallHistory, periods, selectedIndices, targetName, itemKeys, targetObj) {
  // 미래 분기(데이터 없음, future:true 또는 overall null) 자동 제외
  const validIndices = selectedIndices.filter(i =>
    periods[i] && !periods[i].future && overallHistory[i] != null && history[i] != null
  );
  if (validIndices.length === 0) {
    return '<div style="text-align: center; padding: 30px; color: var(--ink-3); font-size: 12px;">표시할 과거 분기 데이터가 없습니다.</div>';
  }
  const filtered = validIndices.map(i => ({
    period: periods[i], score: history[i], overall: overallHistory[i], idx: i,
  }));
  let chartHtml = '';
  if (filtered.length >= 2) {
    chartHtml = svgTrendChartFiltered(filtered, 1100, 130);
  } else {
    const f = filtered[0];
    chartHtml = `
      <div style="text-align: center; padding: 30px 12px; background: #fff; border-radius: 6px;">
        <div style="font-size: 12px; color: var(--ink-3); font-weight: 600;">${escapeHtml(f.period.label)}${f.period.isCurrent ? ' (현재)' : ''}</div>
        <div style="font-size: 36px; font-weight: 700; color: var(--ink); margin: 6px 0;">${f.score.toFixed(2)}</div>
        <div style="font-size: 11px; color: var(--ink-3);">학원 평균: ${f.overall.toFixed(2)} · 차이: ${(f.score - f.overall >= 0 ? '+' : '')}${(f.score - f.overall).toFixed(2)}</div>
      </div>
    `;
  }
  const labels = `<div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-3); margin-top:6px; padding: 0 8px; flex-wrap: wrap;">
    ${filtered.map(f => `<span>${escapeHtml(f.period.label)}${f.period.isCurrent ? '★' : ''}</span>`).join('')}
  </div>`;
  // 총점 표 (강사와 동일)
  const table = `
    <table style="width:100%; margin-top: 12px; font-size: 11.5px; border-collapse: collapse;">
      <thead>
        <tr style="border-bottom: 1px solid var(--line); color: var(--ink-3);">
          <th style="text-align: left; padding: 5px 6px; font-weight: 600;">분기</th>
          <th style="text-align: center; padding: 5px 6px; font-weight: 600;">총점</th>
          <th style="text-align: center; padding: 5px 6px; font-weight: 600;">전분기 대비</th>
          <th style="text-align: center; padding: 5px 6px; font-weight: 600;">학원 평균 대비</th>
        </tr>
      </thead>
      <tbody>
        ${filtered.map((f, i) => {
          const prev = i > 0 ? filtered[i-1].score : null;
          const diff = prev !== null ? f.score - prev : null;
          const diffOverall = f.score - f.overall;
          return `
            <tr style="border-bottom: 1px dashed var(--line); ${f.period.isCurrent ? 'background: var(--accent-soft);' : ''}">
              <td style="padding: 6px;">${escapeHtml(f.period.label)}${f.period.isCurrent ? ' <b style="color:var(--accent);">(현재)</b>' : ''}</td>
              <td style="text-align: center; padding: 6px; font-weight: 700;">${f.score.toFixed(2)}</td>
              <td style="text-align: center; padding: 6px; color: ${diff === null ? 'var(--ink-3)' : (diff > 0 ? 'var(--good)' : (diff < 0 ? 'var(--danger)' : 'var(--ink-3)'))}">${diff === null ? '-' : (diff > 0 ? '+' : '') + diff.toFixed(2)}</td>
              <td style="text-align: center; padding: 6px; color: ${diffOverall > 0 ? 'var(--good)' : 'var(--danger)'}">${diffOverall > 0 ? '+' : ''}${diffOverall.toFixed(2)}</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
  // 항목별 분기 추이 표
  let itemTrendTable = '';
  if (filtered.length >= 2 && itemKeys && itemKeys.length > 0 && targetObj) {
    const periodOffsets = filtered.map(f => f.score - (targetObj.overall || 0));
    const itemChanges = itemKeys.map(k => {
      const baseVal = targetObj[k] || targetObj.overall || 0;
      const itemPeriodScores = filtered.map((f, i) => {
        const itemSeed = seededRand(targetName + '_' + k, f.idx);
        const itemVar = (itemSeed - 0.5) * 0.4;
        return Math.max(2.5, Math.min(5.0, baseVal + periodOffsets[i] + itemVar));
      });
      const change = itemPeriodScores[itemPeriodScores.length - 1] - itemPeriodScores[0];
      return { name: k, scores: itemPeriodScores, change };
    });
    const totalChange = filtered[filtered.length - 1].score - filtered[0].score;
    const worstItem = itemChanges.slice().sort((a, b) => a.change - b.change)[0];
    const bestItem = itemChanges.slice().sort((a, b) => b.change - a.change)[0];

    itemTrendTable = `
      <div style="margin-top: 18px; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 8px;">
        <h4 style="font-size: 13px; font-weight: 700; margin: 0 0 4px; color: var(--ink); display: flex; align-items: center; gap: 6px;">
          📋 항목별 분기 추이 <span style="font-size: 11px; color: var(--ink-3); font-weight: 500;">총점은 ${itemKeys.length}개 항목 평균 · 어느 항목이 떨어졌는지 분석</span>
        </h4>
        <div style="font-size: 12px; color: var(--ink-2); margin: 8px 0 12px; padding: 8px 10px; background: var(--bg); border-radius: 5px; line-height: 1.6;">
          <div><b>총점 ${filtered[0].period.label} → ${filtered[filtered.length - 1].period.label}:</b> ${filtered[0].score.toFixed(2)} → ${filtered[filtered.length - 1].score.toFixed(2)} <span style="color: ${totalChange >= 0 ? 'var(--good)' : 'var(--danger)'}; font-weight: 700;">(${totalChange >= 0 ? '+' : ''}${totalChange.toFixed(2)})</span></div>
          <div style="margin-top: 4px;">
            가장 <span style="color: var(--good); font-weight: 700;">상승</span>: <b>${escapeHtml(bestItem.name)}</b> (${bestItem.change >= 0 ? '+' : ''}${bestItem.change.toFixed(2)}) · 
            가장 <span style="color: var(--danger); font-weight: 700;">하락</span>: <b>${escapeHtml(worstItem.name)}</b> (${worstItem.change >= 0 ? '+' : ''}${worstItem.change.toFixed(2)})
          </div>
        </div>
        <table style="width:100%; font-size: 11.5px; border-collapse: collapse;">
          <thead>
            <tr style="border-bottom: 1.5px solid var(--ink-2); color: var(--ink-2);">
              <th style="text-align: left; padding: 6px 8px; font-weight: 700;">항목</th>
              ${filtered.map(f => `<th style="text-align: center; padding: 6px 8px; font-weight: 700; ${f.period.isCurrent ? 'color: var(--accent);' : ''}">${escapeHtml(f.period.label)}${f.period.isCurrent ? '★' : ''}</th>`).join('')}
              <th style="text-align: center; padding: 6px 8px; font-weight: 700;">변동</th>
            </tr>
          </thead>
          <tbody>
            ${itemChanges.map(item => {
              const isWorst = item.name === worstItem.name && worstItem.change < 0;
              const isBest = item.name === bestItem.name && bestItem.change > 0;
              return `
                <tr style="border-bottom: 1px dashed var(--line); ${isWorst ? 'background:#fff5f5;' : isBest ? 'background:#f4f9f6;' : ''}">
                  <td style="padding: 6px 8px; font-weight: ${isWorst || isBest ? '700' : '500'};">${escapeHtml(item.name)}${isWorst ? ' <span style="color:var(--danger); font-size:10px;">⚠️ 주의</span>' : isBest ? ' <span style="color:var(--good); font-size:10px;">✨ 강점</span>' : ''}</td>
                  ${item.scores.map((s, i) => {
                    const prevS = i > 0 ? item.scores[i-1] : null;
                    const dColor = prevS === null ? 'var(--ink)' : (s > prevS ? 'var(--good)' : (s < prevS ? 'var(--danger)' : 'var(--ink)'));
                    return `<td style="text-align: center; padding: 6px 8px; color: ${dColor}; font-weight: 600;">${s.toFixed(2)}</td>`;
                  }).join('')}
                  <td style="text-align: center; padding: 6px 8px; font-weight: 700; color: ${item.change > 0 ? 'var(--good)' : (item.change < 0 ? 'var(--danger)' : 'var(--ink-3)')};">${item.change > 0 ? '+' : ''}${item.change.toFixed(2)}</td>
                </tr>
              `;
            }).join('')}
            <tr style="border-top: 1.5px solid var(--ink-2); background: var(--accent-soft);">
              <td style="padding: 8px; font-weight: 700; color: var(--accent);">총점 (평균)</td>
              ${filtered.map(f => `<td style="text-align: center; padding: 8px; font-weight: 700; color: var(--accent);">${f.score.toFixed(2)}</td>`).join('')}
              <td style="text-align: center; padding: 8px; font-weight: 700; color: ${totalChange > 0 ? 'var(--good)' : (totalChange < 0 ? 'var(--danger)' : 'var(--ink-3)')};">${totalChange > 0 ? '+' : ''}${totalChange.toFixed(2)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    `;
  }
  return chartHtml + table + itemTrendTable;
}

function svgTrendChartFiltered(filtered, w, h) {
  if (filtered.length < 2) return '';
  const scores = filtered.map(f => f.score);
  const overalls = filtered.map(f => f.overall);
  const allVals = [...scores, ...overalls];
  const min = Math.min(...allVals) - 0.1;
  const max = Math.max(...allVals) + 0.1;
  // h 늘림: 분기 라벨까지 포함 (130 → 165)
  const chartH = h;
  const fullH = h + 35; // 라벨 영역 35px
  const padL = 35, padR = 80; // 좌측 여백 35 (첫 라벨), 우측 80 (평균 + 마지막 라벨)
  const px = i => padL + (i / (filtered.length - 1)) * (w - padL - padR);
  const py = v => chartH - 25 - ((v - min) / (max - min)) * (chartH - 50);
  const linePoints = filtered.map((f, i) => `${px(i)},${py(f.score)}`).join(' ');
  const overallPoints = filtered.map((f, i) => `${px(i)},${py(f.overall)}`).join(' ');
  return `
    <svg viewBox="0 0 ${w} ${fullH}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%; height:auto; display:block;">
      <polyline points="${overallPoints}" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
      <polyline points="${linePoints}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${filtered.map((f, i) => `
        <circle cx="${px(i)}" cy="${py(f.score)}" r="${f.period.isCurrent ? 5 : 3.5}" fill="${f.period.isCurrent ? 'var(--accent)' : '#fff'}" stroke="var(--accent)" stroke-width="${f.period.isCurrent ? 0 : 2}"/>
        <text x="${px(i)}" y="${py(f.score) - 9}" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="${f.period.isCurrent ? '700' : '500'}">${f.score.toFixed(2)}</text>
        <text x="${px(i)}" y="${chartH + 12}" text-anchor="middle" font-size="10.5" fill="${f.period.isCurrent ? 'var(--accent)' : 'var(--ink-3)'}" font-weight="${f.period.isCurrent ? '700' : '500'}">${escapeHtml(f.period.label)}</text>
        ${f.period.isCurrent ? `<text x="${px(i)}" y="${chartH + 25}" text-anchor="middle" font-size="9.5" fill="var(--accent)" font-weight="600">★ 현재</text>` : ''}
      `).join('')}
      <text x="${w - 8}" y="${py(overalls[overalls.length - 1]) + 4}" text-anchor="end" font-size="10" fill="#888">학원평균 ${overalls[overalls.length - 1].toFixed(2)}</text>
    </svg>
  `;
}

window.updateTrendChart = function(kind, name, rangeStr) {
  const range = parseInt(rangeStr);
  let currentScore;
  if (kind === 'teacher') {
    const t = D.teachers.find(x => x.teacher === name);
    if (!t) return;
    currentScore = t.overall;
  } else if (kind === 'haksa') {
    const k = D.haksa && D.haksa.list.find(x => x.name === name);
    if (!k) return;
    currentScore = k.overall;
  } else return;

  const fullHistory = genHistory(name, currentScore);
  const slicedHistory = fullHistory.slice(-range);
  const slicedPeriods = PERIODS.slice(-range);
  const slicedAvg = OVERALL_HISTORY.slice(-range);

  const box = document.getElementById('trendChartBox');
  if (!box) return;
  box.innerHTML = `
    ${svgTrendChart(slicedHistory, slicedAvg, 600, 130)}
    <div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-3); margin-top:6px; padding: 0 8px;">
      ${slicedPeriods.map(p => `<span>${p.label}</span>`).join('')}
    </div>
    <div style="font-size:12.5px; color:var(--ink-2); margin-top:10px; padding-top:10px; border-top: 1px solid var(--line);">
      ${trendSummary(slicedHistory)} <span style="color:var(--ink-3); font-style:italic; font-size:11.5px;">(범위: ${slicedPeriods[0].label} ~ ${slicedPeriods[slicedPeriods.length-1].label})</span>
    </div>
  `;
};

  const targetMap = {};

  D.homerooms.forEach(h => targetMap['homeroom_' + h.teacher] = { name: h.teacher, kind: '담임', score: h.overall });
  if (D.haksa) D.haksa.list.forEach(k => targetMap['haksa_' + k.name] = { name: k.name, kind: '학사', score: k.overall });
  ['급식', '교무운영', '매일깨기', '한국사특강'].forEach(secName => {

function renderFreetext(root) {
  const settings = loadSettings();
  const catSum = D.categories.reduce((a, c) => a + c.n, 0);
  const sentTotal = (D.sentiment.중립 || 0) + (D.sentiment.긍정 || 0) + (D.sentiment['불만/건의'] || 0);
  const maxN = Math.max(...D.categories.map(c => c.n));
  // 영역별 그룹핑
  const AREA_OF = (cat) => {
    if (cat.includes('급식')) return '급식';
    if (cat.includes('매일깨기') || cat.includes('교무') || cat.includes('면학') || cat.includes('졸음') || cat.includes('출결') || cat.includes('직원')) return '교무';
    if (cat.includes('수업') || cat.includes('교재') || cat.includes('과제') || cat.includes('P/F')) return '수업';
    if (cat.includes('한국사')) return '특강';
    if (cat.includes('담임')) return '담임';
    return '시설/기타';
  };

  root.innerHTML = `
    <h1 class="page-title">자유응답</h1>
    <p class="page-desc">${escapeHtml(settings.period.label)} · 자유응답 ${sentTotal}건 · ${D.categories.length}개 카테고리 (1건 중복 매칭 가능)</p>

    <div style="background: #fff8f0; padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 12px; line-height: 1.6; color: var(--ink-2); border-left: 3px solid #d97706;">

    </div>

    <div class="page-actions">
      <button class="dl-btn" onclick="dlFreetext()">자유응답 전체 엑셀</button>
      <button class="cmt-btn" onclick="openAllCategoriesModal()" style="padding: 6px 12px; font-size: 12px;">전체 응답 보기</button>
    </div>

    <div class="metric-grid">
      <div class="metric">
        <div class="metric-label">긍정</div>
        <div class="metric-value" style="color:var(--good);">${D.sentiment.긍정 || 0}<span class="unit"> 건</span></div>
        <div class="metric-foot">전체의 ${((D.sentiment.긍정 || 0) / (sentTotal || 1) * 100).toFixed(1)}%</div>
      </div>
      <div class="metric">
        <div class="metric-label">중립</div>
        <div class="metric-value" style="color:var(--ink-2);">${D.sentiment.중립 || 0}<span class="unit"> 건</span></div>
        <div class="metric-foot">전체의 ${((D.sentiment.중립 || 0) / (sentTotal || 1) * 100).toFixed(1)}%</div>
      </div>
      <div class="metric">
        <div class="metric-label">불만 / 건의</div>
        <div class="metric-value" style="color:var(--warn);">${D.sentiment['불만/건의'] || 0}<span class="unit"> 건</span></div>
        <div class="metric-foot">전체의 ${((D.sentiment['불만/건의'] || 0) / (sentTotal || 1) * 100).toFixed(1)}%</div>
      </div>
    </div>

    <!-- 필터 -->
    <div style="display:flex; gap:8px; align-items:center; margin: 20px 0 12px; flex-wrap:wrap; padding: 10px 12px; background: var(--bg); border-radius: 7px;">
      <span style="font-size:12.5px; font-weight:600; color:var(--ink-2);">필터:</span>
      <select id="ftAreaFilter" onchange="filterCatsByArea()" style="padding:6px 10px; font-size:12px; font-family:inherit; border:1px solid var(--line-2); border-radius:5px;">
        <option value="">전체 영역</option>
        <option value="급식">급식</option>
        <option value="교무">교무</option>
        <option value="수업">수업</option>
        <option value="담임">담임</option>
        <option value="특강">특강</option>
        <option value="시설/기타">시설/기타</option>
      </select>
      <input type="text" id="catSearch" placeholder="카테고리·내용 검색…" oninput="filterCats(this.value)" style="flex:1; min-width:180px; padding:6px 10px; font-size:12px; font-family:inherit; border:1px solid var(--line-2); border-radius:5px;">
      <span style="font-size:11.5px; color:var(--ink-3); margin-left:auto;" id="catVisibleCount">${D.categories.length}개 카테고리 표시</span>
    </div>

    <div class="cat-list" id="catList">
      ${D.categories.map((c, i) => {
        const area = AREA_OF(c.cat);
        return `
        <div class="cat-row" data-cat="${escapeHtml(c.cat).toLowerCase()}" data-area="${escapeHtml(area)}">
          <div class="cat-head" onclick="toggleCat(${i})">
            <div class="cat-name"><span class="pill pill-muted" style="font-size:10.5px; margin-right:6px;">${escapeHtml(area)}</span>${escapeHtml(c.cat)}</div>
            <div class="cat-bar-wrap"><div class="cat-bar" style="width:${(c.n / maxN * 100).toFixed(1)}%;"></div></div>
            <div class="cat-count">${c.n}건</div>

          <div class="cat-body" id="cat-body-${i}">
            <div style="font-size:11.5px; color:var(--ink-3); padding: 4px 0 8px;">미리보기 (먼저 ${Math.min((c.samples || []).length, 5)}건):</div>

              <div class="cat-sample">"${escapeHtml(s.length > 180 ? s.slice(0,180) + '…' : s)}"</div>

                ${c.cat} 전체 ${c.n}건 보기 →
              </button>
            </div>
          </div>
        </div>
        `;
      }).join('')}
    </div>
  `;
}

window.filterCatsByArea = function() {
  const area = document.getElementById('ftAreaFilter').value;
  const search = document.getElementById('catSearch').value.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll('#catList .cat-row').forEach(el => {
    const matchArea = !area || el.dataset.area === area;
    const matchSearch = !search || (el.dataset.cat || '').includes(search);
    const show = matchArea && matchSearch;
    el.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  const cnt = document.getElementById('catVisibleCount');
  if (cnt) cnt.textContent = `${visible}개 카테고리 표시`;
};
window.filterCats = function(q) {
  filterCatsByArea(); // 통합 필터 사용
};

// === 전체 전체 응답 모달 ===
window.openAllCategoriesModal = function() {
  const settings = loadSettings();
  // 모든 카테고리의 모든 응답 펼치기 (중복 텍스트 제거)
  const seen = new Set();
  const allItems = [];
  D.categories.forEach(c => {
    const samples = c.all_samples || c.samples || [];
    samples.forEach(s => {
      const key = s.trim();
      if (!seen.has(key)) {
        seen.add(key);
        allItems.push({ text: s, cat: c.cat });
      }
    });
  });

  showModal(`
    <div class="modal-head">
      <div>
        <h2 class="modal-title">전체 응답 <span style="font-size:13px; color:var(--ink-3); font-weight:500;">${escapeHtml(settings.period.label)}</span></h2>
        <p class="modal-sub">총 ${allItems.length}건 (중복 제거) · 카테고리 ${D.categories.length}개</p>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div style="display:flex; gap:8px; align-items:center; margin-bottom: 10px; flex-wrap:wrap;">
        <input type="text" class="search" id="allCatSearch" style="flex:1; min-width:180px; margin-bottom:0;" placeholder="응답 내용 검색…" oninput="filterAllCats()">
        <select id="allCatFilter" onchange="filterAllCats()" style="padding:7px 12px; font-size:12.5px; font-family:inherit; border:1px solid var(--line-2); border-radius:5px;">
          <option value="">전체 카테고리</option>
          ${D.categories.map(c => `<option value="${escapeHtml(c.cat)}">${escapeHtml(c.cat)} (${c.n})</option>`).join('')}
        </select>
      </div>
      <div style="font-size:12px; color:var(--ink-3); margin-bottom: 10px;">
        <span id="allCatVisibleCount">${allItems.length}건 표시 중</span>
      </div>
      <div id="allCatList">
        ${allItems.map((item, i) => `
          <div class="cmt cmt-modal" data-text="${escapeHtml(item.text).toLowerCase()}" data-cat="${escapeHtml(item.cat)}" style="grid-template-columns: auto 1fr; gap: 12px;">
            <span class="pill pill-muted" style="font-size:10.5px; align-self: start; white-space: nowrap;">${escapeHtml(item.cat)}</span>
            <div class="cmt-text" style="font-size: 12.5px;">${escapeHtml(item.text)}</div>

    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">닫기</button>

window.filterAllCats = function() {
  const q = (document.getElementById('allCatSearch')?.value || '').toLowerCase().trim();
  const cat = (document.getElementById('allCatFilter')?.value || '');
  let visible = 0;
  document.querySelectorAll('#allCatList .cmt').forEach(el => {

// === 부서 통합 선별 모달 (급식·교무·매일깨기) ===
// categoryFilter: 급식의 경우 '맛'/'메뉴'/'양'/'위생'/'기타' 중 하나로 필터 가능
window.openDeptFullModal = function(secName, categoryFilter) {
  const sec = D.sections.find(s => s.sec === secName);
  if (!sec) {
    alert('해당 영역 데이터를 찾을 수 없습니다.');
    return;
  }
  const fullId = 'dept_' + secName;
  const allComments = sec.comments || [];
  let displayComments = allComments;
  let categoryInfo = null;
  if (categoryFilter && sec.categorized_comments) {
    const catList = sec.categorized_comments[categoryFilter] || [];
    displayComments = catList;
    categoryInfo = { name: categoryFilter, count: catList.length, total: allComments.length };
  }
  const exclKey = 'kangan_cmt_excluded_v1_' + fullId;
  const excluded = JSON.parse(localStorage.getItem(exclKey) || '[]');
  // displayComments → 전체 인덱스 매핑
  const indexMap = displayComments.map(c => allComments.indexOf(c));
  const canEdit = (typeof canEditSelection === 'function') ? canEditSelection(fullId) : true;
  const assignee = getAssignee(secName, '미지정');
  const diff = sec.avg - D.meta.overall_score;
  const diffColor = diff >= 0 ? 'var(--good)' : 'var(--danger)';
  const lowAvg = sec.avg < 4.0;
  const includedCount = displayComments.filter((c, i) => !excluded.includes(indexMap[i])).length;
  const excludedCount = displayComments.length - includedCount;

  // 카테고리 탭 (급식인 경우)
  const cats = sec.categorized_comments;
  const catTabsHtml = (cats && Object.keys(cats).length > 0) ? `
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; padding:8px; background:#fafaf6; border-radius:5px;">
      <span style="font-size:11.5px; color:var(--ink-3); align-self:center; margin-right:4px; font-weight:600;">카테고리별 선별:</span>
      <button class="cmt-btn" style="font-size:11px; padding:4px 10px; ${!categoryFilter ? 'background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;' : ''}" onclick="openDeptFullModal('${escapeHtml(secName)}', null)">전체 (${allComments.length})</button>
      ${['맛','메뉴','양','위생','기타'].map(cat => {
        const items = cats[cat] || [];
        if (items.length === 0) return '';
        const active = categoryFilter === cat;
        return `<button class="cmt-btn" style="font-size:11px; padding:4px 10px; ${active ? 'background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;' : ''}" onclick="openDeptFullModal('${escapeHtml(secName)}', '${cat}')">${cat} (${items.length})</button>`;
      }).filter(Boolean).join('')}
    </div>
  ` : '';

  showModal(`
    <div class="modal-head">
      <div>
        <h2 class="modal-title">
          ${escapeHtml(secName)}
          ${categoryInfo ? `<span style="display:inline-block; font-size:12px; padding:3px 9px; background:var(--accent); color:#fff; border-radius:4px; vertical-align:middle; margin-left:6px; font-weight:600;">${escapeHtml(categoryInfo.name)} 카테고리</span>` : `<span style="display:inline-block; font-size:12px; padding:3px 9px; background:var(--accent-soft); color:var(--accent); border-radius:4px; vertical-align:middle; margin-left:6px; font-weight:600;">부서</span>`}
          <span style="font-size:13px; color:var(--ink-3); font-weight:500; margin-left:6px;">전달용 상세</span>
          <span id="selConfirmBadge" style="margin-left:8px; vertical-align:middle;">${typeof renderSelConfirmBadge === 'function' ? renderSelConfirmBadge(fullId) : ''}</span>
        </h2>
        <p class="modal-sub">담당 ${escapeHtml(assignee)} · ${Object.keys(sec.details||{}).length}개 항목 · ${categoryInfo ? `${categoryInfo.name} ${categoryInfo.count}건 (전체 ${categoryInfo.total}건 중)` : `자유응답 ${allComments.length}건`}</p>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="teacher-stats">
        <div class="stat-box"><div class="stat-label">종합</div><div class="stat-value" style="color: ${lowAvg ? 'var(--danger)' : 'var(--good)'};">${sec.avg.toFixed(2)}</div></div>
        <div class="stat-box"><div class="stat-label">학원 대비</div><div class="stat-value" style="color: ${diffColor}; font-size:18px;">${diff >= 0 ? '+' : ''}${diff.toFixed(2)}</div></div>
        <div class="stat-box"><div class="stat-label">${categoryInfo ? categoryInfo.name : '자유응답'}</div><div class="stat-value">${displayComments.length}</div></div>
        <div class="stat-box"><div class="stat-label">권한</div><div class="stat-value" style="font-size:13px;">${canEdit ? '<span class="pill pill-ok">선별 가능</span>' : '<span class="pill pill-muted">읽기 전용</span>'}</div></div>
      </div>

      ${!categoryInfo ? `
      <h2 class="sec" style="margin-top: 18px;">📊 항목별 점수</h2>
      <div style="background: var(--bg); border-radius: 6px; padding: 10px 14px;">
        ${Object.entries(sec.details || {}).sort((a,b) => a[1] - b[1]).map(([k, v]) => `
          <div class="bar-row">
            <div class="bar-label" style="font-size:12px;">${escapeHtml(k)}</div>
            <div class="bar-track" style="flex:1;"><div class="bar-fill ${gradeClass(v)}" style="width:${pct(v)}%">${v.toFixed(2)}</div></div>
            <div class="bar-score">${v.toFixed(2)}</div>
          </div>

      <h2 class="sec" style="margin-top: 18px;">💬 ${categoryInfo ? `${categoryInfo.name} 응답 ${displayComments.length}건` : `학생 자유응답 ${displayComments.length}건`}</h2>
      ${catTabsHtml}
      ${canEdit ? `
        <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center;">
          <button class="cmt-btn" style="padding: 5px 12px; font-size: 12px; background: #f4f9f6; color: #2d6a4f; border-color: #2d6a4f; font-weight:600;" onclick="confirmDeptSelection('${fullId}', '${escapeHtml(secName)}')">선별 확정</button>
          <button class="cmt-btn" style="padding: 5px 12px; font-size: 12px;" onclick="bulkSelectDept('${fullId}', '${categoryFilter || ''}', true)">✓ ${categoryInfo ? '이 카테고리' : '전체'} 포함</button>
          <button class="cmt-btn" style="padding: 5px 12px; font-size: 12px;" onclick="bulkSelectDept('${fullId}', '${categoryFilter || ''}', false)">✗ ${categoryInfo ? '이 카테고리' : '전체'} 제외</button>
          <button class="cmt-btn" style="padding: 5px 12px; font-size: 12px;" onclick="resetDeptSelection('${fullId}')">초기화</button>
          <span id="deptCmtCounter_${fullId.replace(/[^a-zA-Z0-9가-힣]/g,'_')}" style="font-size:11.5px; color:var(--ink-3); margin-left:auto;">포함 ${includedCount}건 · 제외 ${excludedCount}건</span>

          return `
            <div class="cmt ${isExcl ? 'excluded' : ''}" data-target-id="${fullId}" data-idx="${realIdx}" style="display:grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px 12px; background: ${isExcl ? '#f8f8f3' : 'var(--bg)'}; border-radius: 5px; ${isExcl ? 'opacity: 0.5;' : ''}; align-items: start;">

              <div style="display:flex; gap:4px; flex-shrink:0;">
                ${canEdit ? `
                  <button class="cmt-btn" style="font-size:11px; padding: 3px 9px; ${!isExcl ? 'background:var(--good); color:#fff; border-color:var(--good); font-weight:600;' : ''}" onclick="toggleDeptCmtBtn(this, '${fullId}', ${realIdx}, true)">✓ 포함</button>
                  <button class="cmt-btn" style="font-size:11px; padding: 3px 9px; ${isExcl ? 'background:var(--danger); color:#fff; border-color:var(--danger); font-weight:600;' : ''}" onclick="toggleDeptCmtBtn(this, '${fullId}', ${realIdx}, false)">✗ 제외</button>

        <button class="btn btn-secondary" onclick="closeModal()">닫기</button>
      </div>

// 부서 코멘트 토글 (포함/제외 버튼)
window.toggleDeptCmtBtn = function(btn, targetId, idx, isInclude) {
  if (typeof canEditSelection === 'function' && !canEditSelection(targetId)) {
    toast(`선별 권한이 없습니다. 담당자만 변경 가능합니다.`);
    return;
  }
  const exclKey = 'kangan_cmt_excluded_v1_' + targetId;
  let excluded = JSON.parse(localStorage.getItem(exclKey) || '[]');
  if (isInclude) {
    excluded = excluded.filter(x => x !== idx);
  } else {
    if (!excluded.includes(idx)) excluded.push(idx);
  }
  localStorage.setItem(exclKey, JSON.stringify(excluded));
  // UI 즉시 갱신
  const cmtRow = btn.closest('.cmt');
  const btns = cmtRow.querySelectorAll('button.cmt-btn');
  if (btns.length >= 2) {
    if (isInclude) {
      btns[0].style.cssText = 'font-size:11px; padding: 3px 9px; background:var(--good); color:#fff; border-color:var(--good); font-weight:600;';
      btns[1].style.cssText = 'font-size:11px; padding: 3px 9px;';
      cmtRow.style.opacity = '';
      cmtRow.style.background = 'var(--bg)';
      cmtRow.classList.remove('excluded');
    } else {
      btns[0].style.cssText = 'font-size:11px; padding: 3px 9px;';
      btns[1].style.cssText = 'font-size:11px; padding: 3px 9px; background:var(--danger); color:#fff; border-color:var(--danger); font-weight:600;';
      cmtRow.style.opacity = '0.5';
      cmtRow.style.background = '#f8f8f3';
      cmtRow.classList.add('excluded');
    }
  }
  // 카운터 갱신
  const counterId = 'deptCmtCounter_' + targetId.replace(/[^a-zA-Z0-9가-힣]/g, '_');
  const counter = document.getElementById(counterId);
  if (counter) {
    const allCmts = document.querySelectorAll(`#deptCmtList_${targetId.replace(/[^a-zA-Z0-9가-힣]/g, '_')} .cmt`);
    const inc = Array.from(allCmts).filter(c => !c.classList.contains('excluded')).length;
    const exc = allCmts.length - inc;
    counter.textContent = `포함 ${inc}건 · 제외 ${exc}건`;
  }
};

// 일괄 포함/제외
window.bulkSelectDept = function(targetId, categoryFilter, isInclude) {
  if (typeof canEditSelection === 'function' && !canEditSelection(targetId)) {
    toast(`선별 권한이 없습니다.`);
    return;
  }
  const secName = targetId.replace(/^dept_/, '');
  const sec = D.sections.find(s => s.sec === secName);
  if (!sec) return;
  const allComments = sec.comments || [];
  const exclKey = 'kangan_cmt_excluded_v1_' + targetId;
  let excluded = JSON.parse(localStorage.getItem(exclKey) || '[]');
  let targetIndices;
  if (categoryFilter && sec.categorized_comments) {
    const catList = sec.categorized_comments[categoryFilter] || [];
    targetIndices = catList.map(c => allComments.indexOf(c)).filter(i => i >= 0);
  } else {
    targetIndices = allComments.map((_, i) => i);
  }
  if (isInclude) {
    excluded = excluded.filter(i => !targetIndices.includes(i));
  } else {
    targetIndices.forEach(i => { if (!excluded.includes(i)) excluded.push(i); });
  }
  localStorage.setItem(exclKey, JSON.stringify(excluded));
  // 모달 다시 열기
  openDeptFullModal(secName, categoryFilter || null);
};

// 부서 전달용 PDF (모달 안에서 호출) — 카테고리 필터 있으면 그 카테고리만 출력
window.printDeptFullReport = function(secName, categoryFilter) {
  const sec = D.sections.find(s => s.sec === secName);
  if (!sec) return;
  const targetId = 'dept_' + secName;
  const comments = sec.comments || [];
  const exclKey = 'kangan_cmt_excluded_v1_' + targetId;
  const excluded = JSON.parse(localStorage.getItem(exclKey) || '[]');
  const cats = sec.categorized_comments;

  // 출력 대상 결정
  let titleSuffix = '';
  let commentsHtml = '';
  let totalIncluded = 0;
  let totalExcluded = 0;

  if (categoryFilter && cats && cats[categoryFilter]) {
    // 단일 카테고리 모드: 그 카테고리만
    titleSuffix = ' — ' + categoryFilter;
    const catItems = cats[categoryFilter];
    const catIncluded = catItems.filter(c => {
      const idx = comments.indexOf(c);
      return idx >= 0 && !excluded.includes(idx);
    });
    const catExcluded = catItems.length - catIncluded.length;
    totalIncluded = catIncluded.length;
    totalExcluded = catExcluded;
    const catEmojis = {'맛':'👅','메뉴':'🍱','양':'🍚','위생':'🧼','기타':'💬'};
    const catColors = {'맛':'#dc2626','메뉴':'#2563eb','양':'#ea580c','위생':'#0891b2','기타':'#6b7280'};
    const color = catColors[categoryFilter] || '#1f3864';
    commentsHtml = catIncluded.length === 0
      ? '<div class="cmt">선별된 응답이 없습니다.</div>'
      : catIncluded.map(c => `<div class="cmt" style="border-left: 3px solid ${color};">${escapeHtml(c)}</div>`).join('');
  } else if (cats && Object.keys(cats).length > 0) {
    // 전체 모드: 카테고리별 섹션
    const includedCmts = comments.filter((_, i) => !excluded.includes(i));
    totalIncluded = includedCmts.length;
    totalExcluded = excluded.length;
    const catOrder = ['맛','메뉴','양','위생','기타'];
    const catEmojis = {'맛':'👅','메뉴':'🍱','양':'🍚','위생':'🧼','기타':'💬'};
    const catColors = {'맛':'#dc2626','메뉴':'#2563eb','양':'#ea580c','위생':'#0891b2','기타':'#6b7280'};
    const blocks = catOrder.map(cat => {
      const catItems = cats[cat] || [];
      const catIncluded = catItems.filter(c => {
        const idx = comments.indexOf(c);
        return idx >= 0 && !excluded.includes(idx);
      });
      if (catIncluded.length === 0) return null;
      const color = catColors[cat];
      return `
        <h3 style="font-size:14px; margin: 18px 0 8px; color:${color}; border-left:4px solid ${color}; padding-left:8px;">
          ${catEmojis[cat]} ${cat} <span style="color:#666; font-weight:500; font-size:12px;">(${catIncluded.length}건)</span>
        </h3>
        ${catIncluded.map(c => `<div class="cmt" style="border-left: 3px solid ${color};">${escapeHtml(c)}</div>`).join('')}
      `;
    }).filter(Boolean).join('');
    commentsHtml = blocks || '<div class="cmt">선별된 자유응답이 없습니다.</div>';
  } else {
    // 카테고리 없음 (교무·매일깨기): 평면
    const includedCmts = comments.filter((_, i) => !excluded.includes(i));
    totalIncluded = includedCmts.length;
    totalExcluded = excluded.length;
    commentsHtml = includedCmts.length === 0
      ? '<div class="cmt">선별된 자유응답이 없습니다.</div>'
      : includedCmts.map(c => `<div class="cmt">${escapeHtml(c)}</div>`).join('');
  }

  const w = window.open('', '_blank');
  w.document.write(`
    <html><head><title>${secName}${titleSuffix} 전달용</title>
    <style>
      body { font-family: -apple-system, sans-serif; padding: 30px; font-size: 13px; line-height: 1.6; }
      h1 { font-size: 20px; border-bottom: 2px solid #1f3864; padding-bottom: 6px; margin-bottom: 8px; }
      h2 { font-size: 15px; margin-top: 22px; color: #1f3864; }
      h3 { font-size: 14px; }
      .cmt { padding: 8px 12px; background: #f7f6f1; border-radius: 4px; margin-bottom: 6px; font-size: 12px; }
      .meta { color: #666; font-size: 12px; margin-bottom: 12px; }
      table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }
      td, th { padding: 6px 10px; border-bottom: 1px solid #ddd; text-align: left; }
      @media print { body { padding: 15px; } }
    </style>
    </head><body>
      <h1>${escapeHtml(secName)}${escapeHtml(titleSuffix)} - 전달용 평가서</h1>
      <div class="meta">${escapeHtml(D.meta.period)} · 평균 ${sec.avg.toFixed(2)} · 학원 평균 ${D.meta.overall_score.toFixed(2)} · 항목 ${Object.keys(sec.details||{}).length}개 · 자유응답 ${totalIncluded}건 (제외 ${totalExcluded}건)</div>
      <h2>📊 항목별 점수</h2>
      <table>
        <tr><th>항목</th><th style="text-align:right;">점수</th></tr>
        ${Object.entries(sec.details || {}).sort((a,b) => a[1] - b[1]).map(([k, v]) => `<tr><td>${escapeHtml(k)}</td><td style="text-align:right; font-weight:600;">${v.toFixed(2)}</td></tr>`).join('')}
      </table>
      <h2>💬 학생 자유응답${categoryFilter ? ` (${categoryFilter} 카테고리)` : (cats ? ' (카테고리별 정리)' : '')} — ${totalIncluded}건 선별</h2>
      ${commentsHtml}
      <script>setTimeout(() => window.print(), 200);<\\/script>
    </body></html>
  `);
  w.document.close();
  toast(`${secName}${titleSuffix} 전달용 출력`);
};

window.toggleDeptCmt = function(targetId, idx, checked) {
  const exclKey = 'kangan_cmt_excluded_v1_' + targetId;
  let excluded = JSON.parse(localStorage.getItem(exclKey) || '[]');
  if (checked) {
    excluded = excluded.filter(x => x !== idx);
  } else {
    if (!excluded.includes(idx)) excluded.push(idx);
  }
  localStorage.setItem(exclKey, JSON.stringify(excluded));
  // UI 즉시 갱신
  const item = document.querySelector(`#deptCmtList_${targetId} [data-idx="${idx}"]`);
  if (item) {
    if (checked) {
      item.style.opacity = '';
      item.style.background = 'var(--bg)';
    } else {
      item.style.opacity = '0.5';
      item.style.background = '#f8f8f3';
    }
  }
};

window.confirmDeptSelection = function(targetId, name) {
  const exclKey = 'kangan_cmt_excluded_v1_' + targetId;
  const excluded = JSON.parse(localStorage.getItem(exclKey) || '[]');
  // 권한 체크
  if (typeof canEditSelection === 'function' && !canEditSelection(targetId)) {
    toast('확정 권한이 없습니다. 담당자만 가능합니다.');
    return;
  }
  // 확정 마크
  localStorage.setItem('kangan_cmt_confirmed_v1_' + targetId, JSON.stringify({ at: new Date().toISOString(), excluded }));
  toast(`${name} 선별 확정됨 (제외 ${excluded.length}건)`);
};

window.resetDeptSelection = function(targetId) {
  const exclKey = 'kangan_cmt_excluded_v1_' + targetId;
  localStorage.removeItem(exclKey);
  closeModal();
  toast('선별이 초기화되었습니다 (전체 포함).');
};

      <div class="subtitle">${escapeHtml(settings.period.label)} · 담당 ${escapeHtml(info.dept)} · 출력일 ${today}</div>

      <div class="summary">
        <div><b>종합 평균:</b> ${avg.toFixed(2)} / 5.00 (학원 평균 ${D.meta.overall_score.toFixed(2)} 대비 ${(avg - D.meta.overall_score >= 0 ? '+' : '')}${(avg - D.meta.overall_score).toFixed(2)})</div>
      </div>

      <h2>평가 항목별 점수</h2>
      ${Object.entries(itemDetails).map(([k, v]) => `
        <div class="item-row"><span>${escapeHtml(k)}</span><b>${v.toFixed(2)}</b></div>
      `).join('')}

      <h2>학생 자유응답 — 선별</h2>

          ${c.samples.length === 0 ? '<div style="color: #8a8a84; font-size: 12px; padding: 8px;">선별된 응답이 없습니다.</div>' : c.samples.map((s, i) => `

        </div>
      `).join('')}

      <div class="footer">강안교육 만족도 조사 · ${today}</div>
    </body></html>
  `;
  const win = window.open('', '_blank');
  if (!win) { toast('팝업이 차단되었습니다. 팝업 허용 후 다시 시도'); return; }
  win.document.open();
  win.document.write(reportHtml);
  win.document.close();
};
