// 부서 코멘트 토글 (포함/제외 버튼)
window.toggleDeptCmtBtn = function(btn, targetId, idx, isInclude) {
  if (typeof canEditSelection === 'function' && !canEditSelection(targetId)) {
    toast(`선별 권한이 없습니다. 담당자만 변경 가능합니다.`);
    return;
  }
  const exclKey = 'kangan_cmt_excluded_v1_' + targetId;
  let excluded = JSON.parse(localStorage.getItem(exclKey) || '[]');
  if (isInclude) {
    excluded = excluded.filter(x => x !== idx);
  } else {
    if (!excluded.includes(idx)) excluded.push(idx);
  }
  localStorage.setItem(exclKey, JSON.stringify(excluded));
  // UI 즉시 갱신
  const cmtRow = btn.closest('.cmt');
  const btns = cmtRow.querySelectorAll('button.cmt-btn');
  if (btns.length >= 2) {
    if (isInclude) {
      btns[0].style.cssText = 'font-size:11px; padding: 3px 9px; background:var(--good); color:#fff; border-color:var(--good); font-weight:600;';
      btns[1].style.cssText = 'font-size:11px; padding: 3px 9px;';
      cmtRow.style.opacity = '';
      cmtRow.style.background = 'var(--bg)';
      cmtRow.classList.remove('excluded');
    } else {
      btns[0].style.cssText = 'font-size:11px; padding: 3px 9px;';
      btns[1].style.cssText = 'font-size:11px; padding: 3px 9px; background:var(--danger); color:#fff; border-color:var(--danger); font-weight:600;';
      cmtRow.style.opacity = '0.5';
      cmtRow.style.background = '#f8f8f3';
      cmtRow.classList.add('excluded');
    }
  }
  // 카운터 갱신
  const counterId = 'deptCmtCounter_' + targetId.replace(/[^a-zA-Z0-9가-힣]/g, '_');
  const counter = document.getElementById(counterId);
  if (counter) {
    const allCmts = document.querySelectorAll(`#deptCmtList_${targetId.replace(/[^a-zA-Z0-9가-힣]/g, '_')} .cmt`);
    const inc = Array.from(allCmts).filter(c => !c.classList.contains('excluded')).length;
    const exc = allCmts.length - inc;
    counter.textContent = `포함 ${inc}건 · 제외 ${exc}건`;
  }
};

// 일괄 포함/제외
window.bulkSelectDept = function(targetId, categoryFilter, isInclude) {
  if (typeof canEditSelection === 'function' && !canEditSelection(targetId)) {
    toast(`선별 권한이 없습니다.`);
    return;
  }
  const secName = targetId.replace(/^dept_/, '');
  const sec = D.sections.find(s => s.sec === secName);
  if (!sec) return;
  const allComments = sec.comments || [];
  const exclKey = 'kangan_cmt_excluded_v1_' + targetId;
  let excluded = JSON.parse(localStorage.getItem(exclKey) || '[]');
  let targetIndices;
  if (categoryFilter && sec.categorized_comments) {
    const catList = sec.categorized_comments[categoryFilter] || [];
    targetIndices = catList.map(c => allComments.indexOf(c)).filter(i => i >= 0);
  } else {
    targetIndices = allComments.map((_, i) => i);
  }
  if (isInclude) {
    excluded = excluded.filter(i => !targetIndices.includes(i));
  } else {
    targetIndices.forEach(i => { if (!excluded.includes(i)) excluded.push(i); });
  }
  localStorage.setItem(exclKey, JSON.stringify(excluded));
  // 모달 다시 열기
  openDeptFullModal(secName, categoryFilter || null);
};

// 부서 전달용 PDF (모달 안에서 호출) — 카테고리 필터 있으면 그 카테고리만 출력
window.printDeptFullReport = function(secName, categoryFilter) {
  const sec = D.sections.find(s => s.sec === secName);
  if (!sec) return;
  const targetId = 'dept_' + secName;
  const comments = sec.comments || [];
  const exclKey = 'kangan_cmt_excluded_v1_' + targetId;
  const excluded = JSON.parse(localStorage.getItem(exclKey) || '[]');
  const cats = sec.categorized_comments;

  // 출력 대상 결정
  let titleSuffix = '';
  let commentsHtml = '';
  let totalIncluded = 0;
  let totalExcluded = 0;

  if (categoryFilter && cats && cats[categoryFilter]) {
    // 단일 카테고리 모드: 그 카테고리만
    titleSuffix = ' — ' + categoryFilter;
    const catItems = cats[categoryFilter];
    const catIncluded = catItems.filter(c => {
      const idx = comments.indexOf(c);
      return idx >= 0 && !excluded.includes(idx);
    });
    const catExcluded = catItems.length - catIncluded.length;
    totalIncluded = catIncluded.length;
    totalExcluded = catExcluded;
    const catEmojis = {'맛':'👅','메뉴':'🍱','양':'🍚','위생':'🧼','기타':'💬'};
    const catColors = {'맛':'#dc2626','메뉴':'#2563eb','양':'#ea580c','위생':'#0891b2','기타':'#6b7280'};
    const color = catColors[categoryFilter] || '#1f3864';
    commentsHtml = catIncluded.length === 0
      ? '<div class="cmt">선별된 응답이 없습니다.</div>'
      : catIncluded.map(c => `<div class="cmt" style="border-left: 3px solid ${color};">${escapeHtml(c)}</div>`).join('');
  } else if (cats && Object.keys(cats).length > 0) {
    // 전체 모드: 카테고리별 섹션
    const includedCmts = comments.filter((_, i) => !excluded.includes(i));
    totalIncluded = includedCmts.length;
    totalExcluded = excluded.length;
    const catOrder = ['맛','메뉴','양','위생','기타'];
    const catEmojis = {'맛':'👅','메뉴':'🍱','양':'🍚','위생':'🧼','기타':'💬'};
    const catColors = {'맛':'#dc2626','메뉴':'#2563eb','양':'#ea580c','위생':'#0891b2','기타':'#6b7280'};
    const blocks = catOrder.map(cat => {
      const catItems = cats[cat] || [];
      const catIncluded = catItems.filter(c => {
        const idx = comments.indexOf(c);
        return idx >= 0 && !excluded.includes(idx);
      });
      if (catIncluded.length === 0) return null;
      const color = catColors[cat];
      return `
        <h3 style="font-size:14px; margin: 18px 0 8px; color:${color}; border-left:4px solid ${color}; padding-left:8px;">
          ${catEmojis[cat]} ${cat} <span style="color:#666; font-weight:500; font-size:12px;">(${catIncluded.length}건)</span>
        </h3>
        ${catIncluded.map(c => `<div class="cmt" style="border-left: 3px solid ${color};">${escapeHtml(c)}</div>`).join('')}
      `;
    }).filter(Boolean).join('');
    commentsHtml = blocks || '<div class="cmt">선별된 자유응답이 없습니다.</div>';
  } else {
    // 카테고리 없음 (교무·매일깨기): 평면
    const includedCmts = comments.filter((_, i) => !excluded.includes(i));
    totalIncluded = includedCmts.length;
    totalExcluded = excluded.length;
    commentsHtml = includedCmts.length === 0
      ? '<div class="cmt">선별된 자유응답이 없습니다.</div>'
      : includedCmts.map(c => `<div class="cmt">${escapeHtml(c)}</div>`).join('');
  }

  const w = window.open('', '_blank');
  w.document.write(`
    <html><head><title>${secName}${titleSuffix} 전달용</title>
    <style>
      body { font-family: -apple-system, sans-serif; padding: 30px; font-size: 13px; line-height: 1.6; }
      h1 { font-size: 20px; border-bottom: 2px solid #1f3864; padding-bottom: 6px; margin-bottom: 8px; }
      h2 { font-size: 15px; margin-top: 22px; color: #1f3864; }
      h3 { font-size: 14px; }
      .cmt { padding: 8px 12px; background: #f7f6f1; border-radius: 4px; margin-bottom: 6px; font-size: 12px; }
      .meta { color: #666; font-size: 12px; margin-bottom: 12px; }
      table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }
      td, th { padding: 6px 10px; border-bottom: 1px solid #ddd; text-align: left; }
      @media print { body { padding: 15px; } }
    </style>
    </head><body>
      <h1>${escapeHtml(secName)}${escapeHtml(titleSuffix)} - 전달용 평가서</h1>
      <div class="meta">${escapeHtml(D.meta.period)} · 평균 ${sec.avg.toFixed(2)} · 학원 평균 ${D.meta.overall_score.toFixed(2)} · 항목 ${Object.keys(sec.details||{}).length}개 · 자유응답 ${totalIncluded}건 (제외 ${totalExcluded}건)</div>
      <h2>📊 항목별 점수</h2>
      <table>
        <tr><th>항목</th><th style="text-align:right;">점수</th></tr>
        ${Object.entries(sec.details || {}).sort((a,b) => a[1] - b[1]).map(([k, v]) => `<tr><td>${escapeHtml(k)}</td><td style="text-align:right; font-weight:600;">${v.toFixed(2)}</td></tr>`).join('')}
      </table>
      <h2>💬 학생 자유응답${categoryFilter ? ` (${categoryFilter} 카테고리)` : (cats ? ' (카테고리별 정리)' : '')} — ${totalIncluded}건 선별</h2>
      ${commentsHtml}
      <script>setTimeout(() => window.print(), 200);<\\/script>
    </body></html>
  `);
  w.document.close();
  toast(`${secName}${titleSuffix} 전달용 출력`);
};

window.toggleDeptCmt = function(targetId, idx, checked) {
  const exclKey = 'kangan_cmt_excluded_v1_' + targetId;
  let excluded = JSON.parse(localStorage.getItem(exclKey) || '[]');
  if (checked) {
    excluded = excluded.filter(x => x !== idx);
  } else {
    if (!excluded.includes(idx)) excluded.push(idx);
  }
  localStorage.setItem(exclKey, JSON.stringify(excluded));
  // UI 즉시 갱신
  const item = document.querySelector(`#deptCmtList_${targetId} [data-idx="${idx}"]`);
  if (item) {
    if (checked) {
      item.style.opacity = '';
      item.style.background = 'var(--bg)';
    } else {
      item.style.opacity = '0.5';
      item.style.background = '#f8f8f3';
    }
  }
};

window.confirmDeptSelection = function(targetId, name) {
  const exclKey = 'kangan_cmt_excluded_v1_' + targetId;
  const excluded = JSON.parse(localStorage.getItem(exclKey) || '[]');
  // 권한 체크
  if (typeof canEditSelection === 'function' && !canEditSelection(targetId)) {
    toast('확정 권한이 없습니다. 담당자만 가능합니다.');
    return;
  }
  // 확정 마크
  localStorage.setItem('kangan_cmt_confirmed_v1_' + targetId, JSON.stringify({ at: new Date().toISOString(), excluded }));
  toast(`${name} 선별 확정됨 (제외 ${excluded.length}건)`);
};

window.resetDeptSelection = function(targetId) {
  const exclKey = 'kangan_cmt_excluded_v1_' + targetId;
  localStorage.removeItem(exclKey);
  closeModal();
  toast('선별이 초기화되었습니다 (전체 포함).');
};

      <div class="subtitle">${escapeHtml(settings.period.label)} · 담당 ${escapeHtml(info.dept)} · 출력일 ${today}</div>

      <div class="summary">
        <div><b>종합 평균:</b> ${avg.toFixed(2)} / 5.00 (학원 평균 ${D.meta.overall_score.toFixed(2)} 대비 ${(avg - D.meta.overall_score >= 0 ? '+' : '')}${(avg - D.meta.overall_score).toFixed(2)})</div>
      </div>

      <h2>평가 항목별 점수</h2>
      ${Object.entries(itemDetails).map(([k, v]) => `
        <div class="item-row"><span>${escapeHtml(k)}</span><b>${v.toFixed(2)}</b></div>
      `).join('')}

      <h2>학생 자유응답 — 선별</h2>

          ${c.samples.length === 0 ? '<div style="color: #8a8a84; font-size: 12px; padding: 8px;">선별된 응답이 없습니다.</div>' : c.samples.map((s, i) => `

        </div>
      `).join('')}

      <div class="footer">강안교육 만족도 조사 · ${today}</div>
    </body></html>
  `;
  const win = window.open('', '_blank');
  if (!win) { toast('팝업이 차단되었습니다. 팝업 허용 후 다시 시도'); return; }
  win.document.open();
  win.document.write(reportHtml);
  win.document.close();
};

window.filterCmtsInModal = function(q) {
  q = q.toLowerCase().trim();
  document.querySelectorAll('#cmtListInModal .cmt-modal').forEach(el => {
    el.style.display = (!q || el.dataset.cmtText.includes(q)) ? '' : 'none';
  });
};

window.toggleAllCmts = function(yes) {
  document.querySelectorAll('#modalBody .cmt').forEach(el => {
    if (el.style.display === 'none') return; // 검색 필터 적용된 것만
    const yesBtn = el.querySelector('.cmt-btn:nth-child(1)');
    const noBtn = el.querySelector('.cmt-btn:nth-child(2)');
    if (yes) {
      yesBtn.classList.add('on-yes');
      noBtn.classList.remove('on-no');
      el.classList.remove('excluded');
    } else {
      yesBtn.classList.remove('on-yes');
      noBtn.classList.add('on-no');
      el.classList.add('excluded');
    }
  });
};

window.toggleCat = function(i) { document.getElementById(`cat-body-${i}`).classList.toggle('on'); };
window.filterCats = function(q) {
  q = q.toLowerCase().trim();
  document.querySelectorAll('#catList .cat-row').forEach(r => {
    r.classList.toggle('hidden', !!q && !r.dataset.cat.toLowerCase().includes(q));
  });
};

function renderFeedback(root) {
  const settings = loadSettings();
  // 강사 과목별 그룹/순위 사전 계산
  const teachersBySubj = {};
  D.teachers.forEach(t => {
    const subj = (t.subject || ASSIGNEES_SUBJECT[t.teacher] || '기타');
    if (!teachersBySubj[subj]) teachersBySubj[subj] = [];
    teachersBySubj[subj].push(t);
  });
  Object.values(teachersBySubj).forEach(list => list.sort((a,b) => b.overall - a.overall));

  // 모든 평가 대상 통합
  const targets = [];
  D.teachers.forEach(t => {
    const subj = (t.subject || ASSIGNEES_SUBJECT[t.teacher] || '기타');
    const list = teachersBySubj[subj];
    const subjRank = list.findIndex(x => x.teacher === t.teacher) + 1;
    targets.push({
      id: 'teacher_' + t.teacher, name: t.teacher, kind: '강사',
      score: t.overall, threshold: D.meta.overall_score,
      assignee: getAssignee(t.teacher, '수업운영'),
      subject: subj, subjectRank: subjRank, subjectTotal: list.length,
      meta: `학생 ${t.n_students}명 · 종합 ${t.overall.toFixed(2)}`,
    });
  });
  D.homerooms.forEach(h => targets.push({
    id: 'homeroom_' + h.teacher, name: h.teacher, kind: '담임',
    score: h.overall, threshold: D.meta.overall_score,
    assignee: getAssignee(h.teacher, '담임팀장'), subject: '담임',
    meta: `학생 ${h.n}명 · 코멘트 ${(h.comments||[]).length}건`,
  }));
  if (D.haksa) {
    D.haksa.list.forEach(k => targets.push({
      id: 'haksa_' + k.name, name: k.name, kind: '학사',
      score: k.overall, threshold: D.haksa.overall,
      assignee: getAssignee(k.name, '학사담당'), subject: '학사',
      meta: `학사평균 ${D.haksa.overall.toFixed(2)} 대비 ${(k.overall - D.haksa.overall >= 0 ? '+' : '')}${(k.overall - D.haksa.overall).toFixed(2)}`,
    }));
  }
  ['급식', '교무1부', '교무2부', '매일깨기', '한국사특강'].forEach(secName => {
    const sec = D.sections.find(s => s.sec === secName);
    if (!sec) return;
    // 부서 카테고리 분류
    let deptCat = '부서';
    if (secName === '교무1부' || secName === '교무2부' || secName === '매일깨기') deptCat = '교무';
    else if (secName === '급식') deptCat = '급식';
    else if (secName === '한국사특강') deptCat = '특강';

    // 급식: 카테고리별로 분리해서 항목으로 추가 (맛/메뉴/양/위생/기타)
    if (secName === '급식' && sec.categorized_comments) {
      ['맛', '메뉴', '양', '위생', '기타'].forEach(cat => {
        const items = sec.categorized_comments[cat] || [];
        if (items.length === 0) return;
        targets.push({
          id: 'dept_급식__' + cat,
          name: '급식·' + cat,
          kind: '부서',
          score: sec.avg,
          threshold: D.meta.overall_score,
          assignee: getAssignee('급식', '운영지원팀(급식)'),
          subject: '급식',
          meta: `${cat} ${items.length}건 (전체 ${sec.n}건 응답)`,
          catFilter: cat,
          parentSec: '급식',
        });
      });
      return; // 급식 통합 항목은 추가 안 함 (카테고리별로만)
    }

    targets.push({
      id: 'dept_' + secName, name: secName, kind: '부서',
      score: sec.avg, threshold: D.meta.overall_score,
      assignee: getAssignee(secName, DEPT_MAP[secName] || '미지정'), subject: deptCat,
      meta: `응답 ${sec.n}건`,
    });
  });

  // 의무 대상 (설정 기준 적용)
  const mandatory = targets.filter(t => isMandatoryFeedback(t));
  const mandatoryMissing = mandatory.filter(t => getFeedbackCount(t.id) === 0);
  const mandatoryDone = mandatory.filter(t => getFeedbackCount(t.id) > 0);
  const progressPct = mandatory.length === 0 ? 100 : Math.round(mandatoryDone.length / mandatory.length * 100);

  // 담당자별 메트릭 계산 (어드민 제외, 매니저만)
  // 각 담당자가 책임지는 의무 대상 중 미작성·완료 카운트
  const staffMetrics = settings.staff
    .filter(u => u.role === 'manager')
    .map(u => {
      // 이 담당자가 맡은 모든 의무 대상
      const myMandatory = mandatory.filter(t => {
        const assigneeId = getAssigneeId(t.name);
        return assigneeId === u.id;
      });
      const myMissing = myMandatory.filter(t => getFeedbackCount(t.id) === 0);
      const myDone = myMandatory.length - myMissing.length;
      return {
        id: u.id,
        name: u.name,
        total: myMandatory.length,
        missing: myMissing.length,
        done: myDone,
      };
    })
    .filter(m => m.total > 0); // 담당 대상이 있는 직원만

  // 모든 피드백 시간순
  const allFb = loadFeedbacks();
  const histList = [];
  Object.keys(allFb).forEach(targetId => {
    const t = targets.find(x => x.id === targetId);
    (allFb[targetId] || []).forEach(fb => {
      histList.push({ ...fb, targetId, targetName: t ? t.name : targetId, targetKind: t ? t.kind : '' });
    });
  });
  histList.sort((a, b) => b.timestamp.localeCompare(a.timestamp));

  // 활성 기준
  const r = settings.rules;
  const teacherRules = [
    r.teacher_belowAvg ? '평균미만' : null,
    r.teacher_belowScore > 0 ? `${r.teacher_belowScore}미만` : null,
    r.teacher_bottomBySubject ? '과목최하위' : null,
  ].filter(Boolean);
  const haksaRules = [
    r.haksa_belowAvg ? '평균미만' : null,
    r.haksa_belowScore > 0 ? `${r.haksa_belowScore}미만` : null,
  ].filter(Boolean);
  const deptRules = [
    r.dept_belowAvg ? '평균미만' : null,
    r.dept_belowScore > 0 ? `${r.dept_belowScore}미만` : null,
  ].filter(Boolean);
  const forceCount = settings.forceMandatory.length;

  root.innerHTML = `
    <h1 class="page-title">피드백 작성</h1>
    <p class="page-desc">${escapeHtml(settings.period.label)} · 전체 ${targets.length}명 · <b style="color:${mandatoryMissing.length > 0 ? 'var(--danger)' : 'var(--good)'};">안 한 사람 ${mandatoryMissing.length}명</b></p>

    <div class="page-actions">
      <button class="dl-btn" onclick="dlFeedbackHistory()">피드백 히스토리 엑셀</button>
      <button class="cmt-btn" onclick="printAllFeedbackReport('')" style="padding: 6px 12px; font-size: 12px; background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:700;">종합 보고서</button>
      <button class="cmt-btn" onclick="document.querySelector('[data-tab=settings]').click();" style="padding: 6px 12px; font-size: 12px;">기준 설정</button>
      <button class="cmt-btn" onclick="toggleAllFbGroups(true)" style="padding: 6px 12px; font-size: 12px; margin-left: auto;">▼ 모두 펼치기</button>
      <button class="cmt-btn" onclick="toggleAllFbGroups(false)" style="padding: 6px 12px; font-size: 12px;">▶ 모두 접기</button>
    </div>

    <!-- 담당자별 미완료 카드 (직원 수만큼 자동) -->
    ${staffMetrics.length > 0 ? `
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 16px 0;">
      ${staffMetrics.map(m => {
        const isAllDone = m.missing === 0;
        const color = isAllDone ? 'var(--good)' : 'var(--danger)';
        const bg = isAllDone ? 'var(--good-soft)' : 'var(--danger-soft)';
        return `
          <div style="padding: 14px 16px; background: ${bg}; border-radius: 8px; border-left: 4px solid ${color};">
            <div style="font-size: 12px; color: var(--ink-2); font-weight: 600; margin-bottom: 4px;">${escapeHtml(m.name)}</div>
            <div style="font-size: 28px; font-weight: 700; color: ${color}; line-height: 1.1; letter-spacing: -0.02em;">
              ${m.missing}<span style="font-size: 16px; color: var(--ink-3); font-weight: 500;">/${m.total}</span>
            </div>
            <div style="font-size: 11px; color: var(--ink-3); margin-top: 4px;">
              ${isAllDone ? `✓ ${m.total}개 모두 완료` : `${m.missing} 미완료 · ${m.done}개 완료`}
            </div>
          </div>
        `;
      }).join('')}
    </div>
    ` : ''}

    ${(() => {
      // 그룹 정의: 라벨, filter 함수
      const groupDefs = [
        { label: '강사 — 수학', filter: t => t.kind === '강사' && t.subject === '수학' },
        { label: '강사 — 국어', filter: t => t.kind === '강사' && t.subject === '국어' },
        { label: '강사 — 영어', filter: t => t.kind === '강사' && t.subject === '영어' },
        { label: '강사 — 논술', filter: t => t.kind === '강사' && t.subject === '논술' },
        { label: '강사 — 기초특강', filter: t => t.kind === '강사' && t.subject === '기초특강' },
        { label: '강사 — 탐구', filter: t => t.kind === '강사' && (t.subject !== '수학' && t.subject !== '국어' && t.subject !== '영어' && t.subject !== '논술' && t.subject !== '기초특강' && t.subject !== '기타') },
        { label: '담임', filter: t => t.kind === '담임' },
        { label: '교무 (교무1부·교무2부)', filter: t => t.kind === '부서' && (t.name === '교무1부' || t.name === '교무2부') },
        { label: '매일깨기', filter: t => t.kind === '부서' && t.name === '매일깨기' },
        { label: '급식 (맛·메뉴·양·위생·기타)', filter: t => t.kind === '부서' && (t.parentSec === '급식' || t.name === '급식') },
        { label: '특강 (부서)', filter: t => t.kind === '부서' && t.name === '한국사특강' },
        { label: '학사', filter: t => t.kind === '학사' },
      ];
      return groupDefs.map(g => {
        const groupTargets = targets.filter(g.filter).slice().sort((a,b) => a.score - b.score);
        if (groupTargets.length === 0) return '';
        const groupMissing = groupTargets.filter(t => isMandatoryFeedback(t) && getFeedbackCount(t.id) === 0).length;
        const groupMandatoryTotal = groupTargets.filter(t => isMandatoryFeedback(t)).length;
        // 어코디언: 의무 미작성 있으면 자동 펼침, 없으면 접힘. 사용자 토글로 덮어쓰기 가능.
        const stateKey = 'fb_group_' + g.label.replace(/[^가-힣A-Za-z0-9]/g, '_');
        const userState = sessionStorage.getItem(stateKey); // '1'=open, '0'=closed, null=auto
        const isOpen = userState === null ? (groupMissing > 0) : (userState === '1');
        return `
          <div style="margin-bottom: 14px;">
            <div onclick="toggleFbGroup('${stateKey}')" style="background: var(--bg); border-radius: 7px 7px ${isOpen ? '0 0' : '7px 7px'}; padding: 9px 14px; display: flex; align-items: baseline; gap: 8px; border-bottom: ${isOpen ? '2px solid var(--accent)' : '0'}; flex-wrap: wrap; cursor: pointer; user-select: none;">
              <span style="font-size: 11px; color: var(--ink-3); transition: transform .15s; ${isOpen ? 'transform: rotate(90deg);' : ''}">▶</span>
              <b style="font-size:13.5px; color: var(--ink); letter-spacing: -0.01em;">${escapeHtml(g.label)}</b>
              <span style="font-size:11.5px; color:var(--ink-3);">전체 ${groupTargets.length}</span>
              ${groupMandatoryTotal > 0 ? `<span style="font-size:11.5px; color:var(--ink-3);">· 의무 ${groupMandatoryTotal}명</span>` : ''}
              ${groupMissing > 0 ? `<span class="pill pill-bad" style="font-size:10.5px; margin-left:auto;">미작성 ${groupMissing}</span>` : groupMandatoryTotal > 0 ? '<span class="pill pill-good" style="font-size:10.5px; margin-left:auto;">✓ 완료</span>' : '<span style="font-size:10.5px; color:var(--ink-3); margin-left:auto;">의무 없음</span>'}
            </div>
            <div class="card" style="padding: 0; border-radius: 0 0 7px 7px; border-top: 0; display: ${isOpen ? 'block' : 'none'};">
              <div style="overflow-x:auto;">
                <table class="table" style="font-size: 12.5px; margin: 0; table-layout: fixed; width: 100%;">
                  <colgroup>
                    <col style="width: 14%;">
                    <col style="width: 8%;">
                    <col style="width: 9%;">
                    <col style="width: 11%;">
                    <col style="width: 8%;">
                    <col style="width: 11%;">
                    <col style="width: 9%;">
                    <col style="width: 30%;">
                  </colgroup>
                  <thead>
                    <tr>
                      <th>대상자</th>

                            ${t.kind === '부서' ? `<button class="cmt-btn" style="font-size:11px; padding: 3px 9px; background: #f4f9f6; color: #2d6a4f; border-color: #2d6a4f; font-weight: 600; margin-right: 3px;" onclick="openDeptFullModal('${(t.parentSec || t.name).replace(/'/g, "\\'")}', ${t.catFilter ? `'${t.catFilter}'` : 'null'})">📋 선별·전달</button>` : ''}

        `;

    <h2 style="font-size:16px; font-weight:700; margin: 28px 0 12px; color:var(--ink); letter-spacing: -0.02em;">담당자별 현황</h2>

      <div style="font-size:12.5px; color:var(--ink-3); margin-bottom: 14px;">담당자별로 작성한 피드백을 모아 업무 진행 상황을 한눈에 확인합니다. 정렬: 작성 건수 많은 순.</div>
      ${(() => {

                      <span style="font-size:11px; color:var(--ink-3);">${new Date(fb.timestamp).toLocaleString('ko-KR', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'})}</span>

          }).join('')}
        </div>`;
      })()}
    </div>

    <h2 style="font-size:16px; font-weight:700; margin: 28px 0 12px; color:var(--ink); letter-spacing: -0.02em;">히스토리 (${histList.length})</h2>
    <div class="card">
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap;">
        <input type="text" class="search" style="flex:1; min-width:200px; margin:0;" id="fbSearch" placeholder="강사·담임 이름 또는 답변 내용 검색…" oninput="filterFbHistory()">

          <option value="부서">부서</option>
        </select>
        <select id="fbAuthorFilter" onchange="filterFbHistory()" style="padding:7px 12px; font-size:12.5px; border:1px solid var(--line-2); border-radius:5px; font-family:inherit;">
          <option value="">전체 작성자</option>
          ${settings.staff.map(u => `<option value="${escapeHtml(u.name)}">${escapeHtml(u.name)}</option>`).join('')}
        </select>
        <button class="cmt-btn" style="font-size:11.5px; padding:6px 10px;" onclick="document.querySelectorAll('#fbHistList details').forEach(d=>d.open=true)">▼ 모두 펼치기</button>
        <button class="cmt-btn" style="font-size:11.5px; padding:6px 10px;" onclick="document.querySelectorAll('#fbHistList details').forEach(d=>d.open=false)">▶ 모두 접기</button>
      </div>
      <div style="font-size:11px; color:var(--ink-3); margin-bottom:10px; line-height:1.5;">
        💡 카드를 클릭하면 4개 답변이 펼쳐집니다. 강사명으로 검색하면 그 강사의 모든 분기 피드백이 정렬됩니다.
      </div>
      <div id="fbHistList">
        ${histList.length === 0
          ? '<div class="empty">아직 작성된 피드백이 없습니다.</div>'
          : histList.map(fb => {
              const targetFbList = (loadFeedbacks()[fb.targetId] || []);
              const histIdx = targetFbList.findIndex(x => x.timestamp === fb.timestamp);
              // 한 줄 요약 (첫 답변 첫 50자)
              const ans = fb.answers || {};
              const firstAnsKey = Object.keys(ans)[0];
              const firstAns = firstAnsKey !== undefined ? ans[firstAnsKey] : (fb.text || '').replace(/Q\d.*?A\.\s*/gs, ' ').trim();
              const ansCount = Object.keys(ans).length || 1;
              const summary = String(firstAns).slice(0, 60).replace(/\n/g, ' ') + (String(firstAns).length > 60 ? '…' : '');

              return `

                    <div style="display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap;">

                        <div style="font-size:12px; color:var(--ink-2); line-height:1.5;">${escapeHtml(summary)} <span style="color:var(--ink-3);">(${ansCount}개 답변)</span></div>
                      </div>
                      <div style="text-align:right; font-size:11px; color:var(--ink-3); white-space:nowrap;">
                        <div>${escapeHtml(fb.author || '대표')} · ${escapeHtml(fb.method || '대면')}</div>
                        <div>${dateStr}</div>
                        <div style="color:var(--accent); font-weight:600; margin-top:2px;">▼ 상세보기</div>
                      </div>
                    </div>
                  </summary>
                  <div style="padding: 0 14px 14px;">
                    <div style="border-top: 1px solid var(--line); padding-top: 12px;">
                      <div class="fb-history-text">${formatFbBody(fb)}</div>
                      <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;">
                        <button class="cmt-btn" style="font-size:11.5px; padding:5px 10px;" onclick="event.stopPropagation(); printFeedbackReport('${fb.targetId}', '${String(fb.targetName).replace(/'/g, "\\'")}', '${fb.targetKind}', ${histIdx})">📄 PDF</button>
                        <button class="cmt-btn" style="font-size:11.5px; padding:5px 10px;" onclick="event.stopPropagation(); downloadFeedbackXlsx('${fb.targetId}', '${String(fb.targetName).replace(/'/g, "\\'")}', '${fb.targetKind}', ${histIdx})">📊 엑셀</button>
                        ${fb.targetKind === '강사' ? `<button class="cmt-btn" style="font-size:11.5px; padding:5px 10px; background:#f4f9f6; color:#2d6a4f; border-color:#2d6a4f; font-weight:600;" onclick="event.stopPropagation(); openTeacherModal('${String(fb.targetName).replace(/'/g, "\\'")}')">강사 모달 열기</button>` : ''}
                      </div>
                    </div>
                  </div>
                </details>
              `;
            }).join('')
        }
      </div>
    </div>
  `;
}

window.filterFbHistory = function() {
  const q = (document.getElementById('fbSearch')?.value || '').toLowerCase().trim();
  const kindF = (document.getElementById('fbKindFilter')?.value || '');
  const authF = (document.getElementById('fbAuthorFilter')?.value || '');
  document.querySelectorAll('#fbHistList > .fb-history-item').forEach(el => {
    const matches = (!q || (el.dataset.name || '').includes(q) || (el.dataset.text || '').includes(q))
      && (!kindF || el.dataset.kind === kindF)
      && (!authF || el.dataset.author === authF);
    el.style.display = matches ? '' : 'none';
  });
};

let __HAKSA_ASSIGNEE_FILTER = '전체';

function renderHaksa(root) {
  if (!D.haksa) {
    root.innerHTML = '<h1 class="page-title">학사 평가</h1><div class="empty">학사 데이터가 없습니다.</div>';
    return;
  }
  // 담당자 카운트
  const assigneeCount = {};
  D.haksa.list.forEach(h => {
    const a = getAssignee(h.name, '미지정');
    assigneeCount[a] = (assigneeCount[a] || 0) + 1;
  });
  const assignees = ['전체', ...Object.keys(assigneeCount).sort()];
  // 필터 적용
  let filtered = [...D.haksa.list];
  if (__HAKSA_ASSIGNEE_FILTER !== '전체') {
    filtered = filtered.filter(h => getAssignee(h.name, '미지정') === __HAKSA_ASSIGNEE_FILTER);
  }
  const sorted = filtered.sort((a,b) => b.overall - a.overall);
  const haksaAvg = D.haksa.overall;

  root.innerHTML = `
    <h1 class="page-title">학사 평가</h1>
    <p class="page-desc">학사 ${D.haksa.list.length}개 (학사 평균 ${haksaAvg.toFixed(2)}). 학사별 6개 항목(아침식사·기상관리·셔틀 정숙·휴대폰 관리·학사복귀후 관리·청소/빨래) 평가. 행 클릭 시 학생 코멘트, [피드백]으로 의견 기록.</p>

    <div class="page-actions">
      <button class="dl-btn" onclick="dlHaksa()">학사 전체 엑셀 (학사·항목별·코멘트·피드백)</button>
    </div>

    <div class="metric-grid">
      <div class="metric">
        <div class="metric-label">학사 평균</div>
        <div class="metric-value">${haksaAvg.toFixed(2)}<span class="unit"> / 5.00</span></div>
        <div class="metric-bar"><span style="width:${pct(haksaAvg)}%; background: var(--good);"></span></div>
        <div class="metric-foot">12개 학사 평균</div>
      </div>
      <div class="metric">
        <div class="metric-label">우수 학사 (TOP)</div>
        <div class="metric-value" style="font-size:22px;">${sorted[0].name}<span class="unit"> ${sorted[0].overall.toFixed(2)}</span></div>
        <div class="metric-foot up">학사평균 대비 +${(sorted[0].overall - haksaAvg).toFixed(2)}</div>
      </div>
      <div class="metric">
        <div class="metric-label">개선 필요 (BOTTOM)</div>
        <div class="metric-value" style="font-size:22px;">${sorted[sorted.length-1].name}<span class="unit"> ${sorted[sorted.length-1].overall.toFixed(2)}</span></div>
        <div class="metric-foot down">학사평균 대비 ${(sorted[sorted.length-1].overall - haksaAvg).toFixed(2)}</div>
      </div>
    </div>

    <div class="subtabs" style="margin-top:8px;">
      <span style="font-size:11.5px; color:var(--ink-3); font-weight:600; align-self:center; margin-right:6px;">담당자:</span>
      ${assignees.map(a => {
        const count = a === '전체' ? D.haksa.list.length : (assigneeCount[a] || 0);
        return `<button class="subtab ${__HAKSA_ASSIGNEE_FILTER === a ? 'active' : ''}" onclick="__HAKSA_ASSIGNEE_FILTER='${a}'; renderHaksa(document.getElementById('main'));">${escapeHtml(a)} (${count})</button>`;
      }).join('')}
    </div>

    <div class="card">
      <h2 class="card-title">🏠 학사 ${sorted.length}개${__HAKSA_ASSIGNEE_FILTER !== '전체' ? ' · ' + __HAKSA_ASSIGNEE_FILTER + ' 담당' : ''} <span class="card-sub">학사평균 ${haksaAvg.toFixed(2)} 미만은 빨간 띠 · 행 클릭 시 학생 코멘트</span></h2>
      <div style="overflow-x: auto;">
      <table class="table">
        <thead>
          <tr>
            <th style="text-align:center;">순위</th>
            <th>학사</th>
            <th>담당자</th>
            <th style="text-align:right;">종합</th>
            ${D.haksa.questions.map(q => `<th style="text-align:right; font-size:10.5px;">${q}</th>`).join('')}
            <th style="text-align:right;">코멘트</th>
            <th>피드백</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${sorted.map((h, i) => {
            const [pillText, pillCls] = gradeText(h.overall);
            const isBad = h.overall < haksaAvg;
            const rowCls = isBad ? 'row-bad' : (i < 3 ? 'row-good' : '');
            const targetId = 'haksa_' + h.name;
            return `
              <tr class="${rowCls}">
                <td style="text-align:center;"><span class="pill pill-muted">${i+1}</span></td>
                <td class="clickable" onclick="openHaksaModal('${h.name.replace(/'/g, "\\'")}')"><b>${h.name}</b></td>
                <td><span class="assignee-tag">${getAssignee(h.name, '학사담당')}</span></td>
                <td class="num" style="font-size:14.5px; color: ${isBad ? 'var(--danger)' : 'var(--ink)'};">${h.overall.toFixed(2)}</td>
                ${D.haksa.questions.map(q => {
                  const v = h.scores[q];

              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
}

  const headers = Array.from(document.querySelectorAll('div[onclick]')).filter(el => {

window.updateStaffField = function(staffId, field, value) {
  const s = loadSettings();
  const staff = s.staff.find(u => u.id === staffId);
  if (!staff) return;
  const oldValue = staff[field];
  if (field === 'name') value = String(value).trim();
  if (oldValue === value) return; // 변경 없음
  // 어드민이 1명뿐인데 다른 권한으로 바꾸려는 경우 차단
  if (field === 'role' && oldValue === 'admin' && value !== 'admin') {
    const adminCount = s.staff.filter(u => u.role === 'admin').length;
    if (adminCount <= 1) {
      toast('어드민은 최소 1명 필요. 다른 직원을 어드민으로 먼저 변경하세요.');
      // 원복
      const sel = document.querySelector(`select[onchange*="${staffId}"]`);
      if (sel) sel.value = 'admin';
      return;
    }
  }
  staff[field] = value;
  saveSettings(s);
  const labels = { name: '이름', role: '권한', password: '비밀번호' };
  toast(`${staff.name} - ${labels[field]} 저장됨`);
  // 시각 피드백: 변경된 줄 잠깐 녹색
  try {
    const tgt = event && event.target;
    if (tgt) {
      const row = tgt.closest('tr');
      if (row) {
        row.style.transition = 'background 0.6s';
        row.style.background = 'var(--good-soft)';
        setTimeout(() => { row.style.background = ''; }, 1200);
      }
    }
  } catch {}
  // 본인 정보 변경 시 세션 정보도 갱신 표시
  if (currentUser && currentUser.id === staffId) {
    Object.assign(currentUser, staff);
    refreshStatusBadge();
  }
};

// ====== 재계약 검토 탭 ======
function renderRecontract(root) {
  // 시드 기반 재현 가능한 가짜 분기 추이 생성 (실운영 시 Firebase 누적 데이터로 교체)
  const PERIODS = ['2026-1차', '2026-2차', '2026-3차', '2027-1차', '2027-2차'];
  function seededRand(seedStr, n) {
    const s = (seedStr.charCodeAt(0) || 65) + (seedStr.length * 7) + n * 13;
    const x = Math.sin(s) * 10000;
    return Math.abs(x - Math.floor(x));
  }

  const recontractData = D.teachers.map(t => {
    const base = t.overall;
    // 5분기 추이: 마지막은 실제 점수, 과거는 ±0.15 범위에서 변동
    const series = [];
    for (let i = 0; i < 4; i++) {
      const noise = (seededRand(t.teacher, i) - 0.5) * 0.25;
      const trend_factor = -0.1 + (i / 4) * 0.1; // 살짝 상승 추세 더해줌
      series.push(Math.max(3.5, Math.min(5.0, base + trend_factor + noise)));
    }
    series.push(base); // 현재 분기 = 실제 점수
    const series_rounded = series.map(s => Math.round(s * 100) / 100);

    const last = series_rounded[4];
    const prev = series_rounded[3];
    const yoy_idx = 1; // 2026-2차 → 1년 전 동분기 가정 (2026-2차 vs 2027-2차)
    // 더 정확히는 2026-1차 (idx=0) vs 2027-1차 (idx=3)이지만 시각화용으로 단순화
    const yoy = last - series_rounded[0];
    const delta = last - prev;

    let recommend, badgeCls;
    if (last >= 4.6 && delta >= -0.05) { recommend = '재계약 권장'; badgeCls = 'rc-good'; }
    else if (last >= 4.4 && delta >= -0.10) { recommend = '관찰 (정상)'; badgeCls = 'rc-soso'; }
    else if (last >= 4.2 && delta > 0.05) { recommend = '관찰 (개선중)'; badgeCls = 'rc-warn'; }
    else if (last >= 4.0) { recommend = '면담 필요'; badgeCls = 'rc-warn'; }
    else { recommend = '재계약 우려'; badgeCls = 'rc-bad'; }

    return {
      teacher: t.teacher,
      n_students: t.n_students,
      periods: PERIODS,
      series: series_rounded,
      last, delta, yoy,
      recommend, badgeCls,
    };
  });
  // 재계약 권장도순 정렬 (BOTTOM 강사 먼저 보이게)
  const order = { 'rc-bad': 0, 'rc-warn': 1, 'rc-soso': 2, 'rc-good': 3 };
  recontractData.sort((a, b) => order[a.badgeCls] - order[b.badgeCls] || a.last - b.last);
  window.__RC_DATA = recontractData;

  // 학원 전체 평균 분기 추이 (가짜)
  const avgSeries = [4.32, 4.36, 4.34, 4.38, 4.40];

  // SVG 라인차트 생성기 (강사 series + 학원평균 비교)
  function svgLineChart(series, avgSeries, w, h) {
    const min = 3.5, max = 5.0;
    const padX = 4, padY = 6;
    const pts = (vals) => vals.map((v, i) => {
      const x = padX + (i / (vals.length - 1)) * (w - 2 * padX);
      const y = h - padY - ((v - min) / (max - min)) * (h - 2 * padY);
      return [x, y];
    });
    const teacherPts = pts(series);
    const avgPts = pts(avgSeries);

    // 4.4 기준선 y좌표
    const baseY = h - padY - ((4.4 - min) / (max - min)) * (h - 2 * padY);

    const teacherPath = 'M ' + teacherPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L ');
    const avgPath = 'M ' + avgPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L ');

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="overflow:visible;">
      <line x1="${padX}" y1="${baseY}" x2="${w - padX}" y2="${baseY}" stroke="#d4d1c4" stroke-width="0.7" stroke-dasharray="2,3"/>
      <text x="${w - padX}" y="${baseY - 3}" text-anchor="end" font-size="9" fill="#8a8a84" font-family="Pretendard">평균 4.40</text>
      <path d="${avgPath}" stroke="#b8b6ae" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
      <path d="${teacherPath}" stroke="#1f3864" stroke-width="2.2" fill="none"/>
      ${teacherPts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${i === series.length - 1 ? '#1f3864' : '#fff'}" stroke="#1f3864" stroke-width="1.5"/>`).join('')}
      ${teacherPts.map((p, i) => `<text x="${p[0].toFixed(1)}" y="${(p[1] - 8).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1a1a1a" font-family="Pretendard">${series[i].toFixed(2)}</text>`).join('')}
    </svg>`;
  }

  root.innerHTML = `
    <h1 class="page-title">재계약 검토</h1>
    <p class="page-desc">강사별 분기 추이와 학원 평균 대비 변동을 한눈에 확인할 수 있습니다. 재계약 권장도순으로 정렬됩니다.</p>

    <div class="page-actions">
      <button class="dl-btn" onclick="dlRecontract()">재계약 검토 엑셀 (분기 추이 포함)</button>
    </div>

    <div class="alert-info">

function showModal(html) {
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.add('on');
  document.body.style.overflow = 'hidden';
  // 자유응답 카운터 갱신 (선별 영구 저장 반영)
  setTimeout(refreshCmtCounter, 50);
}
window.closeModal = function() {
  document.getElementById('modalBg').classList.remove('on');
  document.body.style.overflow = '';
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

window.doLogin = function() {
  const userId = document.getElementById('loginUser').value;
  const pwd = document.getElementById('loginPwd').value;
  const s = loadSettings();
  const user = s.staff.find(u => u.id === userId);
  if (!user || user.password !== pwd) {
    document.getElementById('loginErr').textContent = '비밀번호가 일치하지 않습니다.';
    return;
  }
  setCurrentUser(user.id);
  location.reload();
};

// 본인 비밀번호 변경
window.changeMyPassword = function() {
  if (!currentUser) return;
  const oldPwd = prompt('현재 비밀번호를 입력하세요:');
  if (oldPwd === null) return;
  if (oldPwd !== currentUser.password) {
    alert('현재 비밀번호가 일치하지 않습니다.');
    return;
  }
  const newPwd = prompt('새 비밀번호를 입력하세요 (4자 이상):');
  if (newPwd === null) return;
  if (!newPwd || newPwd.length < 4) {
    alert('비밀번호는 4자 이상이어야 합니다.');
    return;
  }
  const confirmPwd = prompt('새 비밀번호를 다시 입력하세요:');
  if (confirmPwd === null) return;
  if (newPwd !== confirmPwd) {
    alert('새 비밀번호가 일치하지 않습니다.');
    return;
  }
  const s = loadSettings();
  const staff = s.staff.find(u => u.id === currentUser.id);
  if (!staff) return;
  staff.password = newPwd;
  saveSettings(s);
  currentUser.password = newPwd;
  alert('비밀번호가 변경되었습니다.');
};
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

  apiKey: "AIzaSyCgwHuWurTJHkYmB_EvE3KBrVVad3lbk4g",
  authDomain: "kangan-survey.firebaseapp.com",
  projectId: "kangan-survey",
  storageBucket: "kangan-survey.firebasestorage.app",
  messagingSenderId: "540432014473",
  appId: "1:540432014473:web:fda47bfb990fdcf775ba58"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 전역으로 노출 - dlRawData가 호출
window.__firestoreFetchAllResponses = async function() {
  try {
    const q = query(collection(db, 'responses'), orderBy('submittedAt', 'asc'));
    const snap = await getDocs(q);
    const responses = [];
    snap.forEach(doc => {
      responses.push({ _id: doc.id, ...doc.data() });
    });
    return responses;
  } catch (e) {
    console.error('[Firebase] 응답 가져오기 실패:', e);
    throw e;
  }
};

console.log('[Firebase] 관리자 페이지 초기화 완료. 학생 응답 자동 동기화.');
</script>
