window.filterFbHistory = function() {
  const q = (document.getElementById('fbSearch')?.value || '').toLowerCase().trim();
  const kindF = (document.getElementById('fbKindFilter')?.value || '');
  const authF = (document.getElementById('fbAuthorFilter')?.value || '');
  document.querySelectorAll('#fbHistList > .fb-history-item').forEach(el => {
    const matches = (!q || (el.dataset.name || '').includes(q) || (el.dataset.text || '').includes(q))
      && (!kindF || el.dataset.kind === kindF)
      && (!authF || el.dataset.author === authF);
    el.style.display = matches ? '' : 'none';
  });
};

// ====== 학사 평가 탭 ======
let __HAKSA_ASSIGNEE_FILTER = '전체';

function renderHaksa(root) {
  if (!D.haksa) {
    root.innerHTML = '<h1 class="page-title">학사 평가</h1><div class="empty">학사 데이터가 없습니다.</div>';
    return;
  }
  // 담당자 카운트
  const assigneeCount = {};
  D.haksa.list.forEach(h => {
    const a = getAssignee(h.name, '미지정');
    assigneeCount[a] = (assigneeCount[a] || 0) + 1;
  });
  const assignees = ['전체', ...Object.keys(assigneeCount).sort()];
  // 필터 적용
  let filtered = [...D.haksa.list];
  if (__HAKSA_ASSIGNEE_FILTER !== '전체') {
    filtered = filtered.filter(h => getAssignee(h.name, '미지정') === __HAKSA_ASSIGNEE_FILTER);
  }
  const sorted = filtered.sort((a,b) => b.overall - a.overall);
  const haksaAvg = D.haksa.overall;

  root.innerHTML = `
    <h1 class="page-title">학사 평가</h1>
    <p class="page-desc">학사 ${D.haksa.list.length}개 (학사 평균 ${haksaAvg.toFixed(2)}). 학사별 6개 항목(아침식사·기상관리·셔틀 정숙·휴대폰 관리·학사복귀후 관리·청소/빨래) 평가. 행 클릭 시 학생 코멘트, [피드백]으로 의견 기록.</p>

    <div class="page-actions">
      <button class="dl-btn" onclick="dlHaksa()">학사 전체 엑셀 (학사·항목별·코멘트·피드백)</button>
    </div>

    <div class="metric-grid">
      <div class="metric">
        <div class="metric-label">학사 평균</div>
        <div class="metric-value">${haksaAvg.toFixed(2)}<span class="unit"> / 5.00</span></div>
        <div class="metric-bar"><span style="width:${pct(haksaAvg)}%; background: var(--good);"></span></div>
        <div class="metric-foot">12개 학사 평균</div>
      </div>
      <div class="metric">
        <div class="metric-label">우수 학사 (TOP)</div>
        <div class="metric-value" style="font-size:22px;">${sorted[0].name}<span class="unit"> ${sorted[0].overall.toFixed(2)}</span></div>
        <div class="metric-foot up">학사평균 대비 +${(sorted[0].overall - haksaAvg).toFixed(2)}</div>
      </div>
      <div class="metric">
        <div class="metric-label">개선 필요 (BOTTOM)</div>
        <div class="metric-value" style="font-size:22px;">${sorted[sorted.length-1].name}<span class="unit"> ${sorted[sorted.length-1].overall.toFixed(2)}</span></div>
        <div class="metric-foot down">학사평균 대비 ${(sorted[sorted.length-1].overall - haksaAvg).toFixed(2)}</div>
      </div>
    </div>

    <div class="subtabs" style="margin-top:8px;">
      <span style="font-size:11.5px; color:var(--ink-3); font-weight:600; align-self:center; margin-right:6px;">담당자:</span>
      ${assignees.map(a => {
        const count = a === '전체' ? D.haksa.list.length : (assigneeCount[a] || 0);
        return `<button class="subtab ${__HAKSA_ASSIGNEE_FILTER === a ? 'active' : ''}" onclick="__HAKSA_ASSIGNEE_FILTER='${a}'; renderHaksa(document.getElementById('main'));">${escapeHtml(a)} (${count})</button>`;
      }).join('')}
    </div>

    <div class="card">
      <h2 class="card-title">🏠 학사 ${sorted.length}개${__HAKSA_ASSIGNEE_FILTER !== '전체' ? ' · ' + __HAKSA_ASSIGNEE_FILTER + ' 담당' : ''} <span class="card-sub">학사평균 ${haksaAvg.toFixed(2)} 미만은 빨간 띠 · 행 클릭 시 학생 코멘트</span></h2>
      <div style="overflow-x: auto;">
      <table class="table">
        <thead>
          <tr>
            <th style="text-align:center;">순위</th>
            <th>학사</th>
            <th>담당자</th>
            <th style="text-align:right;">종합</th>
            ${D.haksa.questions.map(q => `<th style="text-align:right; font-size:10.5px;">${q}</th>`).join('')}
            <th style="text-align:right;">코멘트</th>
            <th>피드백</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${sorted.map((h, i) => {
            const [pillText, pillCls] = gradeText(h.overall);
            const isBad = h.overall < haksaAvg;
            const rowCls = isBad ? 'row-bad' : (i < 3 ? 'row-good' : '');
            const targetId = 'haksa_' + h.name;
            return `
              <tr class="${rowCls}">
                <td style="text-align:center;"><span class="pill pill-muted">${i+1}</span></td>
                <td class="clickable" onclick="openHaksaModal('${h.name.replace(/'/g, "\\'")}')"><b>${h.name}</b></td>
                <td><span class="assignee-tag">${getAssignee(h.name, '학사담당')}</span></td>
                <td class="num" style="font-size:14.5px; color: ${isBad ? 'var(--danger)' : 'var(--ink)'};">${h.overall.toFixed(2)}</td>
                ${D.haksa.questions.map(q => {
                  const v = h.scores[q];
                  return `<td class="num" style="color:var(--ink-3); font-size:12px;">${v != null ? v.toFixed(2) : '-'}</td>`;
                }).join('')}
                <td class="num" style="color:var(--ink-3); font-weight:500;">${(h.comments || []).length}건</td>
                <td>${fbStatusBadge(targetId, h.overall, haksaAvg)}</td>
                <td><button class="cmt-btn" style="background: #f4f9f6; color: #2d6a4f; border-color: #2d6a4f; font-weight: 600; margin-right: 3px;" onclick="event.stopPropagation(); openHaksaModal('${h.name.replace(/'/g, "\\'")}')">📋 선별·전달</button><button class="cmt-btn" onclick="event.stopPropagation(); openFeedbackModal('${targetId}', '${h.name.replace(/'/g, "\\'")}', '학사', '종합 ${h.overall.toFixed(2)} · 학사평균 ${haksaAvg.toFixed(2)} 대비 ${(h.overall - haksaAvg >= 0 ? '+' : '')}${(h.overall - haksaAvg).toFixed(2)}')">피드백</button></td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
}

// ====== 급식 평가 탭 ======
function renderFood(root) {
  const foodSec = D.sections.find(s => s.sec === '급식');
  if (!foodSec) { root.innerHTML = '<h1 class="page-title">급식</h1><div class="empty">데이터 없음</div>'; return; }
  const targetId = 'dept_급식';

  const foodHistory = genHistory('급식', foodSec.avg, 'section');

  root.innerHTML = `
    <h1 class="page-title">급식 평가</h1>
    <p class="page-desc">담당 <span class="assignee-tag">운영지원팀(급식)</span>. 급식 ${Object.keys(foodSec.details || {}).length}개 항목 평가, 학생 자유응답 ${(foodSec.comments || []).length}건.</p>

    <div class="page-actions">
      <button class="dl-btn" onclick="dlFood()">급식 평가 엑셀</button>
    </div>

    <div class="metric-grid">
      <div class="metric">
        <div class="metric-label">급식 평균</div>
        <div class="metric-value">${foodSec.avg.toFixed(2)}<span class="unit"> / 5.00</span></div>
        <div class="metric-bar"><span style="width:${pct(foodSec.avg)}%; background: ${foodSec.avg >= 4.0 ? 'var(--accent)' : 'var(--warn)'};"></span></div>
        <div class="metric-foot">${Object.keys(foodSec.details || {}).length}개 항목 · 학원 평균 대비 ${(foodSec.avg - D.meta.overall_score >= 0 ? '+' : '')}${(foodSec.avg - D.meta.overall_score).toFixed(2)} · 자유응답 ${(foodSec.comments || []).length}건</div>
        <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
          ${fbStatusBadge(targetId, foodSec.avg, D.meta.overall_score)}
          <button class="cmt-btn" style="padding: 3px 9px; font-size:11.5px; background:#f4f9f6; color:#2d6a4f; border-color:#2d6a4f; font-weight:600;" onclick="openDeptFullModal('급식')">📄 📋 선별·전달</button>
          <button class="cmt-btn" style="padding: 3px 9px; font-size:11.5px;" onclick="openFeedbackModal('${targetId}', '급식', '부서', '평균 ${foodSec.avg.toFixed(2)} · 자유응답 ${(foodSec.comments || []).length}건')">피드백</button>
        </div>
      </div>
      <div class="metric">
        <div class="metric-label">자유응답</div>
        <div class="metric-value">${(foodSec.comments || []).length}<span class="unit"> 건</span></div>
        <div class="metric-foot">학생들이 직접 작성한 의견 · 카드 [전달용]에서 전체 열람·선별</div>
      </div>
    </div>

    <h2 style="font-size:16px; font-weight:700; margin: 22px 0 12px; color:var(--ink); letter-spacing: -0.02em;">📈 분기별 추이</h2>
    <div class="card">
      ${(() => {
        // 부서 모달 컨텍스트 등록 (refreshPeriodSelector에서 사용)
        if (!window._deptModalContext) window._deptModalContext = {};
        const foodObj = { overall: foodSec.avg, ...foodSec.details };
        window._deptModalContext['급식'] = { overall: foodSec.avg, items: Object.keys(foodSec.details || {}), obj: foodObj };
        return `
          <div style="font-size:11px; color:var(--ink-3); margin-bottom:8px; line-height:1.5;">
            아래 분기를 클릭해서 보고 싶은 분기를 선택하세요. <b>여러 개 동시 선택 가능 · 현재 분기도 해제 가능</b> (최소 1개).
          </div>
          <div id="periodSelector_급식" style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px;">
            ${PERIODS.slice().reverse().map((p, revIdx) => {
              const realIdx = PERIODS.length - 1 - revIdx;
              const isCurrent = p.isCurrent;
              return `
                <button data-period-idx="${realIdx}" onclick="togglePeriod('급식', ${realIdx})" class="period-btn" style="padding: 5px 11px; font-size: 11.5px; font-family: inherit; border: 1px solid var(--accent); background: ${isCurrent ? 'var(--accent)' : 'var(--accent-soft)'}; color: ${isCurrent ? '#fff' : 'var(--accent)'}; border-radius: 4px; cursor: pointer; font-weight: ${isCurrent ? '700' : '500'};">
                  ${escapeHtml(p.label)}${isCurrent ? ' (현재)' : ''}
                </button>
              `;
            }).join('')}
          </div>
          <div style="display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;">
            <button class="cmt-btn" style="font-size:11px; padding:3px 8px;" onclick="setPeriodSelection('급식', 'all')">전체 선택</button>
            <button class="cmt-btn" style="font-size:11px; padding:3px 8px;" onclick="setPeriodSelection('급식', 'recent3')">최근 3개</button>
            <button class="cmt-btn" style="font-size:11px; padding:3px 8px;" onclick="setPeriodSelection('급식', 'recent6')">최근 6개</button>
            <button class="cmt-btn" style="font-size:11px; padding:3px 8px;" onclick="setPeriodSelection('급식', 'current')">현재만</button>
          </div>
          <div id="trendChartBox_급식">
            ${renderSelectedPeriodChartGeneric(foodHistory, OVERALL_HISTORY, PERIODS, PERIODS.map((_, i) => i), '급식', Object.keys(foodSec.details || {}), foodObj)}
          </div>
        `;
      })()}
    </div>

    <h2 style="font-size:16px; font-weight:700; margin: 22px 0 12px; color:var(--ink); letter-spacing: -0.02em;">📊 급식 — 평가 항목별 점수</h2>
    <div class="card">
      <div style="font-size:12.5px; color:var(--ink-3); margin-bottom: 14px;">학생이 평가한 4개 항목. 점수 낮은 순 정렬.</div>
      ${Object.entries(foodSec.details || {}).sort((a,b) => a[1] - b[1]).map(([k, v]) => `
        <div class="bar-row">
          <div class="bar-label">${k}${v < 4.0 ? ' <span class="pill pill-bad" style="margin-left:6px; font-size:10px;">개선 필요</span>' : ''}</div>
          <div class="bar-track"><div class="bar-fill ${gradeClass(v)}" style="width:${pct(v)}%">${v.toFixed(2)}</div></div>
          <div class="bar-score">${v.toFixed(2)}</div>
        </div>
      `).join('')}
    </div>

    <h2 style="font-size:16px; font-weight:700; margin: 22px 0 12px; color:var(--ink); letter-spacing: -0.02em;">💬 학생 자유응답 ${(foodSec.comments || []).length}건 <span style="font-size:11px; color:var(--ink-3); font-weight:500;">· AI 자동 카테고리 분류</span></h2>
    ${(() => {
      const cats = foodSec.categorized_comments || null;
      if (!cats || (foodSec.comments || []).length === 0) {
        // fallback: 평면 리스트
        return `
          <div class="card">
            ${(foodSec.comments || []).length === 0 ? '<div style="color:var(--ink-3); font-size:13px; padding: 14px;">자유응답이 없습니다.</div>' : `
              <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                <button class="cmt-btn" style="padding: 5px 11px; font-size: 11.5px; background: #f4f9f6; color: #2d6a4f; border-color: #2d6a4f; font-weight: 600;" onclick="openDeptFullModal('급식')">전체 ${(foodSec.comments || []).length}건 보기 + 선별 →</button>
              </div>
              <div style="display:grid; gap:6px;">
                ${(foodSec.comments || []).slice(0, 8).map(s => `<div style="font-size:12.5px; color:var(--ink-2); padding: 8px 12px; background: var(--bg); border-radius: 5px; line-height:1.5;">"${escapeHtml(s.length > 180 ? s.slice(0,180) + '…' : s)}"</div>`).join('')}
              </div>
            `}
          </div>
        `;
      }
      // 카테고리별 카드
      const catOrder = ['맛', '메뉴', '양', '위생', '기타'];
      const catColors = {'맛':'#dc2626', '메뉴':'#2563eb', '양':'#ea580c', '위생':'#0891b2', '기타':'#6b7280'};
      const catEmojis = {'맛':'👅', '메뉴':'🍱', '양':'🍚', '위생':'🧼', '기타':'💬'};
      return `
        <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
          <button class="cmt-btn" style="padding: 5px 11px; font-size: 11.5px; background: #f4f9f6; color: #2d6a4f; border-color: #2d6a4f; font-weight: 600;" onclick="openDeptFullModal('급식')">전체 ${(foodSec.comments || []).length}건 보기 + 선별 →</button>
          <span style="font-size:11.5px; color:var(--ink-3); align-self:center;">카테고리는 AI 키워드 자동 분류. 각 카테고리당 미리보기 5건.</span>
        </div>
        <div style="display:grid; gap:14px;">
          ${catOrder.map(cat => {
            const items = cats[cat] || [];
            if (items.length === 0) return '';
            const color = catColors[cat];
            return `
              <div class="card" style="padding: 14px 16px;">
                <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:10px; flex-wrap:wrap;">
                  <div style="display:flex; align-items:baseline; gap:8px;">
                    <span style="font-size:18px;">${catEmojis[cat]}</span>
                    <b style="font-size:14px; color:${color};">${cat}</b>
                    <span style="font-size:12px; color:var(--ink-3);">${items.length}건 (${(items.length / (foodSec.comments||[]).length * 100).toFixed(0)}%)</span>
                  </div>
                  <div style="display:flex; gap:8px; align-items:center;">
                    <div class="cat-bar-wrap" style="width:120px; height:6px; background:var(--bg); border-radius:3px; overflow:hidden;">
                      <div style="width:${(items.length / (foodSec.comments||[]).length * 100).toFixed(1)}%; height:100%; background:${color};"></div>
                    </div>
                    <button class="cmt-btn" style="font-size:11px; padding:4px 10px; background:#f4f9f6; color:#2d6a4f; border-color:#2d6a4f; font-weight:600; white-space:nowrap;" onclick="openDeptFullModal('급식', '${cat}')">📋 ${cat}만 선별·전달</button>
                  </div>
                </div>
                <div style="display:grid; gap:5px;">
                  ${items.slice(0, 5).map(s => `<div style="font-size:12.5px; color:var(--ink-2); padding: 7px 11px; background: var(--bg); border-radius: 5px; line-height:1.5; border-left: 3px solid ${color};">"${escapeHtml(s.length > 180 ? s.slice(0,180) + '…' : s)}"</div>`).join('')}
                  ${items.length > 5 ? `<div style="font-size:11px; color:var(--ink-3); padding: 4px 11px;">… 외 ${items.length - 5}건. 위 [${cat}만 선별·전달] 또는 위 [전체 선별·전달]에서 전체 보기</div>` : ''}
                </div>
              </div>
            `;
          }).filter(Boolean).join('')}
        </div>
      `;
    })()}
  `;
}

// ====== 교무 평가 탭 ======
// ====== 부서 페이지 공통 헬퍼 ======
function _renderDeptCard(sec, targetIdSuffix, label) {
  if (!sec) return '';
  const targetId = 'dept_' + (targetIdSuffix || sec.sec);
  const lowAvg = sec.avg < 4.0;
  return `
    <div class="metric">
      <div class="metric-label">${escapeHtml(label || sec.sec)}</div>
      <div class="metric-value" style="color: ${lowAvg ? 'var(--warn)' : 'var(--ink)'};">${sec.avg.toFixed(2)}<span class="unit"> / 5.00</span></div>
      <div class="metric-bar"><span style="width:${pct(sec.avg)}%; background: ${lowAvg ? 'var(--warn)' : 'var(--accent)'};"></span></div>
      <div class="metric-foot">${Object.keys(sec.details || {}).length}개 항목 · 학원 평균 대비 ${(sec.avg - D.meta.overall_score >= 0 ? '+' : '')}${(sec.avg - D.meta.overall_score).toFixed(2)} · 자유응답 ${(sec.comments||[]).length}건</div>
      <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
        ${fbStatusBadge(targetId, sec.avg, D.meta.overall_score)}
        <button class="cmt-btn" style="padding: 3px 9px; font-size:11.5px; background:#f4f9f6; color:#2d6a4f; border-color:#2d6a4f; font-weight:600;" onclick="openDeptFullModal('${escapeHtml(sec.sec)}')">📄 📋 선별·전달</button>
        <button class="cmt-btn" style="padding: 3px 9px; font-size:11.5px;" onclick="openFeedbackModal('${targetId}', '${escapeHtml(label || sec.sec)}', '부서', '평균 ${sec.avg.toFixed(2)} · 자유응답 ${(sec.comments||[]).length}건')">피드백</button>
      </div>
    </div>
  `;
}

function _renderDeptTrend(sec, label) {
  if (!sec) return '';
  if (!window._deptModalContext) window._deptModalContext = {};
  const obj = { overall: sec.avg, ...sec.details };
  window._deptModalContext[sec.sec] = { overall: sec.avg, items: Object.keys(sec.details || {}), obj };
  const history = genHistory(sec.sec, sec.avg, 'section');
  return `
    <h2 style="font-size:16px; font-weight:700; margin: 22px 0 12px; color:var(--ink); letter-spacing: -0.02em;">📈 ${escapeHtml(label || sec.sec)} — 분기별 추이</h2>
    <div class="card">
      <div style="font-size:11px; color:var(--ink-3); margin-bottom:8px; line-height:1.5;">
        아래 분기를 클릭해서 보고 싶은 분기를 선택하세요. <b>여러 개 동시 선택 가능 · 현재 분기도 해제 가능</b> (최소 1개).
      </div>
      <div id="periodSelector_${sec.sec}" style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px;">
        ${PERIODS.slice().reverse().map((p, revIdx) => {
          const realIdx = PERIODS.length - 1 - revIdx;
          const isCurrent = p.isCurrent;
          return `<button data-period-idx="${realIdx}" onclick="togglePeriod('${sec.sec}', ${realIdx})" class="period-btn" style="padding: 5px 11px; font-size: 11.5px; font-family: inherit; border: 1px solid var(--accent); background: ${isCurrent ? 'var(--accent)' : 'var(--accent-soft)'}; color: ${isCurrent ? '#fff' : 'var(--accent)'}; border-radius: 4px; cursor: pointer; font-weight: ${isCurrent ? '700' : '500'};">${escapeHtml(p.label)}${isCurrent ? ' (현재)' : ''}</button>`;
        }).join('')}
      </div>
      <div style="display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;">
        <button class="cmt-btn" style="font-size:11px; padding:3px 8px;" onclick="setPeriodSelection('${sec.sec}', 'all')">전체 선택</button>
        <button class="cmt-btn" style="font-size:11px; padding:3px 8px;" onclick="setPeriodSelection('${sec.sec}', 'current')">현재만</button>
      </div>
      <div id="trendChartBox_${sec.sec}">
        ${renderSelectedPeriodChartGeneric(history, OVERALL_HISTORY, PERIODS, PERIODS.map((_, i) => i), sec.sec, Object.keys(sec.details || {}), obj)}
      </div>
    </div>
  `;
}

function _renderDeptItems(sec, label) {

window.setSettingsSection = function(key) {
  sessionStorage.setItem('settings_active', key);
  renderTab('settings');
};

// 담당 매핑 그룹 펼치기/접기
window.toggleAssignGroup = function(stateKey) {
  const cur = sessionStorage.getItem(stateKey) !== '0';
  sessionStorage.setItem(stateKey, cur ? '0' : '1');
  renderTab('settings');
};

// 피드백 페이지 그룹 펼치기/접기
window.toggleFbGroup = function(stateKey) {
  const cur = sessionStorage.getItem(stateKey);
  let newState;
  if (cur === null) newState = '0';
  else if (cur === '0') newState = '1';
  else newState = '0';
  sessionStorage.setItem(stateKey, newState);

  // 헤더 div 찾기 - onclick에 stateKey가 포함된 div
  const headers = Array.from(document.querySelectorAll('div[onclick]')).filter(el => {
    const oc = el.getAttribute('onclick') || '';
    return oc.includes('toggleFbGroup') && oc.includes(stateKey);
  });
  if (headers.length === 0) return;
  const header = headers[0];
  const card = header.nextElementSibling;
  const arrow = header.querySelector('span'); // 첫 ▶ span

  if (newState === '1') {
    if (card) card.style.display = 'block';
    if (arrow) arrow.style.transform = 'rotate(90deg)';
    header.style.borderBottom = '2px solid var(--accent)';
    header.style.borderRadius = '7px 7px 0 0';
  } else {
    if (card) card.style.display = 'none';
    if (arrow) arrow.style.transform = '';
    header.style.borderBottom = '0';
    header.style.borderRadius = '7px';
  }
};

// 모든 피드백 그룹 펼치기/접기
window.toggleAllFbGroups = function(open) {
  const labels = ['강사 — 수학', '강사 — 국어', '강사 — 영어', '강사 — 논술',
                  '담임', '교무 (교무1부·교무2부)', '매일깨기', '급식 (맛·메뉴·양·위생·기타)', '특강 (부서)', '학사'];
  labels.forEach(label => {
    const stateKey = 'fb_group_' + label.replace(/[^가-힣A-Za-z0-9]/g, '_');
    sessionStorage.setItem(stateKey, open ? '1' : '0');
  });
  renderTab('feedback');
};

// 의무 기준만 저장
window.saveRulesOnly = function() {
  if (!isSurveyDraft()) {
    toast('세팅 중일 때만 변경 가능');
    return;
  }
  const s = loadSettings();
  ['teacher_belowAvg', 'teacher_bottomBySubject', 'haksa_belowAvg', 'dept_belowAvg'].forEach(k => {
    const el = document.getElementById('set_rule_' + k);
    if (el) s.rules[k] = el.checked;
  });
  [
    ['teacher_belowScore', 'set_rule_teacher_belowScoreOn', 'set_rule_teacher_belowScore'],
    ['haksa_belowScore', 'set_rule_haksa_belowScoreOn', 'set_rule_haksa_belowScore'],
    ['dept_belowScore', 'set_rule_dept_belowScoreOn', 'set_rule_dept_belowScore'],
  ].forEach(([key, onId, scoreId]) => {
    const onEl = document.getElementById(onId);
    const scoreEl = document.getElementById(scoreId);
    if (onEl && scoreEl) {
      const score = parseFloat(scoreEl.value);
      s.rules[key] = onEl.checked && !isNaN(score) ? score : 0;
    }
  });
  saveSettings(s);
  toast('의무 기준 저장됨');
  refreshFbBadge();
};

window.updateStaffField = function(staffId, field, value) {

  if (!staff) return;
  const oldValue = staff[field];
  if (field === 'name') value = String(value).trim();

  // 어드민이 1명뿐인데 다른 권한으로 바꾸려는 경우 차단
  if (field === 'role' && oldValue === 'admin' && value !== 'admin') {

    if (adminCount <= 1) {

      const sel = document.querySelector(`select[onchange*="${staffId}"]`);

  saveSettings(s);

  toast(`${staff.name} - ${labels[field]} 저장됨`);

  try {
    const tgt = event && event.target;

        row.style.background = 'var(--good-soft)';

      }
    }
  } catch {}
  // 본인 정보 변경 시 세션 정보도 갱신 표시
  if (currentUser && currentUser.id === staffId) {
    Object.assign(currentUser, staff);

// ====== 재계약 검토 탭 ======
function renderRecontract(root) {
  // 시드 기반 재현 가능한 가짜 분기 추이 생성 (실운영 시 Firebase 누적 데이터로 교체)
  const PERIODS = ['2026-1차', '2026-2차', '2026-3차', '2027-1차', '2027-2차'];
  function seededRand(seedStr, n) {
    const s = (seedStr.charCodeAt(0) || 65) + (seedStr.length * 7) + n * 13;
    const x = Math.sin(s) * 10000;
    return Math.abs(x - Math.floor(x));
  }

  const recontractData = D.teachers.map(t => {
    const base = t.overall;
    // 5분기 추이: 마지막은 실제 점수, 과거는 ±0.15 범위에서 변동
    const series = [];
    for (let i = 0; i < 4; i++) {
      const noise = (seededRand(t.teacher, i) - 0.5) * 0.25;
      const trend_factor = -0.1 + (i / 4) * 0.1; // 살짝 상승 추세 더해줌
      series.push(Math.max(3.5, Math.min(5.0, base + trend_factor + noise)));
    }
    series.push(base); // 현재 분기 = 실제 점수
    const series_rounded = series.map(s => Math.round(s * 100) / 100);

    const last = series_rounded[4];
    const prev = series_rounded[3];
    const yoy_idx = 1; // 2026-2차 → 1년 전 동분기 가정 (2026-2차 vs 2027-2차)
    // 더 정확히는 2026-1차 (idx=0) vs 2027-1차 (idx=3)이지만 시각화용으로 단순화
    const yoy = last - series_rounded[0];
    const delta = last - prev;

    let recommend, badgeCls;
    if (last >= 4.6 && delta >= -0.05) { recommend = '재계약 권장'; badgeCls = 'rc-good'; }
    else if (last >= 4.4 && delta >= -0.10) { recommend = '관찰 (정상)'; badgeCls = 'rc-soso'; }
    else if (last >= 4.2 && delta > 0.05) { recommend = '관찰 (개선중)'; badgeCls = 'rc-warn'; }
    else if (last >= 4.0) { recommend = '면담 필요'; badgeCls = 'rc-warn'; }
    else { recommend = '재계약 우려'; badgeCls = 'rc-bad'; }

    return {
      teacher: t.teacher,
      n_students: t.n_students,
      periods: PERIODS,
      series: series_rounded,
      last, delta, yoy,
      recommend, badgeCls,
    };
  });
  // 재계약 권장도순 정렬 (BOTTOM 강사 먼저 보이게)
  const order = { 'rc-bad': 0, 'rc-warn': 1, 'rc-soso': 2, 'rc-good': 3 };
  recontractData.sort((a, b) => order[a.badgeCls] - order[b.badgeCls] || a.last - b.last);
  window.__RC_DATA = recontractData;

  // 학원 전체 평균 분기 추이 (가짜)
  const avgSeries = [4.32, 4.36, 4.34, 4.38, 4.40];

  // SVG 라인차트 생성기 (강사 series + 학원평균 비교)
  function svgLineChart(series, avgSeries, w, h) {
    const min = 3.5, max = 5.0;
    const padX = 4, padY = 6;
    const pts = (vals) => vals.map((v, i) => {
      const x = padX + (i / (vals.length - 1)) * (w - 2 * padX);
      const y = h - padY - ((v - min) / (max - min)) * (h - 2 * padY);
      return [x, y];
    });
    const teacherPts = pts(series);
    const avgPts = pts(avgSeries);

    // 4.4 기준선 y좌표
    const baseY = h - padY - ((4.4 - min) / (max - min)) * (h - 2 * padY);

    const teacherPath = 'M ' + teacherPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L ');
    const avgPath = 'M ' + avgPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L ');

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="overflow:visible;">
      <line x1="${padX}" y1="${baseY}" x2="${w - padX}" y2="${baseY}" stroke="#d4d1c4" stroke-width="0.7" stroke-dasharray="2,3"/>
      <text x="${w - padX}" y="${baseY - 3}" text-anchor="end" font-size="9" fill="#8a8a84" font-family="Pretendard">평균 4.40</text>
      <path d="${avgPath}" stroke="#b8b6ae" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
      <path d="${teacherPath}" stroke="#1f3864" stroke-width="2.2" fill="none"/>
      ${teacherPts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${i === series.length - 1 ? '#1f3864' : '#fff'}" stroke="#1f3864" stroke-width="1.5"/>`).join('')}
      ${teacherPts.map((p, i) => `<text x="${p[0].toFixed(1)}" y="${(p[1] - 8).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1a1a1a" font-family="Pretendard">${series[i].toFixed(2)}</text>`).join('')}
    </svg>`;
  }

  root.innerHTML = `
    <h1 class="page-title">재계약 검토</h1>
    <p class="page-desc">강사별 분기 추이와 학원 평균 대비 변동을 한눈에 확인할 수 있습니다. 재계약 권장도순으로 정렬됩니다.</p>

    <div class="page-actions">
      <button class="dl-btn" onclick="dlRecontract()">재계약 검토 엑셀 (분기 추이 포함)</button>
    </div>

    <div class="alert-info">
      <b>시제품 안내:</b> 과거 분기 데이터(2026-1차 ~ 2027-1차)는 시연용 가상 데이터입니다. 마지막 분기(2027-2차)만 실제 487명 응답 기반입니다. <b>Firebase 연결 후</b>부터는 실제 누적 데이터로 자동 갱신됩니다. 차트의 파란 실선이 강사, 회색 점선이 학원 평균입니다.
    </div>

    <div class="recontract-grid">
      ${recontractData.map(r => `
        <div class="rc-card" onclick="openRecontractModal('${r.teacher.replace(/'/g, "\\'")}')">
          <div class="rc-head">
            <div>
              <div class="rc-name">${r.teacher}</div>
              <div class="rc-meta">학생 ${r.n_students}명 · 종합 ${r.last.toFixed(2)}</div>
            </div>
            <span class="rc-banner ${r.badgeCls}">${r.recommend}</span>
          </div>
          <div class="rc-chart">
            ${svgLineChart(r.series, avgSeries, 380, 110)}
            <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--ink-3); margin-top:4px; padding: 0 4px;">
              ${r.periods.map(p => `<span>${p}</span>`).join('')}
            </div>
          </div>
          <div class="rc-stats">
            <div><b>${r.last.toFixed(2)}</b>현재 분기</div>
            <div><b class="${r.delta >= 0 ? 'up' : 'down'}">${r.delta >= 0 ? '+' : ''}${r.delta.toFixed(2)}</b>전분기 대비</div>
            <div><b class="${r.yoy >= 0 ? 'up' : 'down'}">${r.yoy >= 0 ? '+' : ''}${r.yoy.toFixed(2)}</b>전년 동분기</div>
          </div>
        </div>
      `).join('')}
    </div>

    <h2 class="rc-section-h">📋 재계약 권장도 요약</h2>
    <div class="card">
      <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:12px;">
        ${[
          ['rc-good', '재계약 권장', '4.6 이상 + 안정세'],
          ['rc-soso', '관찰 (정상)', '4.4~4.6 또는 안정세'],
          ['rc-warn', '면담 필요 / 개선중', '4.0~4.4'],
          ['rc-bad', '재계약 우려', '4.0 미만 또는 하락'],
        ].map(([cls, label, desc]) => {
          const count = recontractData.filter(r => r.badgeCls === cls).length;
          return `<div style="background:var(--bg); padding:14px; border-radius:8px; text-align:center;">
            <span class="rc-banner ${cls}" style="font-size:11px;">${label}</span>
            <div style="font-size:24px; font-weight:700; margin-top:6px; letter-spacing:-0.025em;">${count}<span style="font-size:13px; color:var(--ink-3); font-weight:500;">명</span></div>
            <div style="font-size:11px; color:var(--ink-3); margin-top:2px;">${desc}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

        <div style="font-size: 12.5px; color: var(--ink-3); margin-top: 4px;">관리자 콘솔 로그인</div>
      </div>
      <label style="display:block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px;">사용자</label>
      <select id="loginUser" style="width: 100%; padding: 10px 12px; font-size: 13.5px; font-family: inherit; border: 1px solid var(--line-2); border-radius: 6px; margin-bottom: 14px;">
        ${s.staff.map(u => `<option value="${escapeHtml(u.id)}">${escapeHtml(u.name)}</option>`).join('')}
      </select>
      <label style="display:block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px;">비밀번호</label>
      <input type="password" id="loginPwd" placeholder="비밀번호" style="width: 100%; padding: 10px 12px; font-size: 13.5px; font-family: inherit; border: 1px solid var(--line-2); border-radius: 6px; margin-bottom: 6px;" onkeypress="if(event.key==='Enter') doLogin()">
      <div id="loginErr" style="font-size: 11.5px; color: var(--danger); min-height: 18px; margin-bottom: 8px;"></div>
      <button onclick="doLogin()" style="width: 100%; padding: 11px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;">로그인</button>
      <div style="margin-top: 14px; padding: 10px 12px; background: var(--bg); border-radius: 6px; font-size: 11px; color: var(--ink-3); line-height: 1.55;">
        <b>시제품 안내:</b> 모든 계정 비밀번호는 <b>0000</b>입니다. 실운영 시 Firebase Auth로 교체됩니다.
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}
window.doLogin = function() {
  const userId = document.getElementById('loginUser').value;
  const pwd = document.getElementById('loginPwd').value;
  const s = loadSettings();
  const user = s.staff.find(u => u.id === userId);
  if (!user || user.password !== pwd) {
    document.getElementById('loginErr').textContent = '비밀번호가 일치하지 않습니다.';
    return;
  }
  setCurrentUser(user.id);
  location.reload();
};
window.logout = logout;

// 로그인 체크
const currentUser = getCurrentUser();
if (!currentUser) {
  showLoginScreen();
} else {
  // 사이드바에 사용자 표시
  const aside = document.querySelector('aside');
  if (aside) {
    const userBox = document.createElement('div');
    userBox.style.cssText = 'margin-top: 14px; padding: 10px 12px; background: var(--card); border-radius: 7px; border: 1px solid var(--line); font-size: 11.5px; line-height: 1.55;';
    userBox.innerHTML = `
      <div style="font-weight: 700; color: var(--ink); font-size: 13px; margin-bottom: 6px;">${escapeHtml(currentUser.name)}</div>
      <div style="display: flex; gap: 4px;">
        <button onclick="changeMyPassword()" style="flex: 1; background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); font-size: 10.5px; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-family: inherit;">비번변경</button>
        <button onclick="logout()" style="flex: 1; background: transparent; border: 1px solid var(--line-2); color: var(--ink-3); font-size: 10.5px; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-family: inherit;">로그아웃</button>
      </div>
    `;
    aside.appendChild(userBox);
  }
  refreshSubjectMapping();
  // 초기 brand-period & 학사 카운트
  const bp = document.getElementById('brandPeriod');
  if (bp && D && D.meta) bp.textContent = D.meta.period;
  const navHk = document.getElementById('navHaksaCount');
  if (navHk && D && D.haksa && D.haksa.list) navHk.textContent = D.haksa.list.length + '개';
  renderPeriodSelector();
  renderTab('dashboard');
  
  // Firebase에서 새 분기 응답 자동 로드 (백그라운드, 한 번만)
  setTimeout(async () => {
    try {
      const result = await loadFirebasePeriods();
      if (result && result.added > 0) {
        renderPeriodSelector();
        toast(`Firebase에서 ${result.added}개 분기 자동 로드됨`);
      }
    } catch (e) {
      console.error('[Firebase] 자동 로드 실패:', e);
    }
  }, 1500);
}

// 본인 비밀번호 변경
window.changeMyPassword = function() {
  if (!currentUser) return;
  const oldPwd = prompt('현재 비밀번호를 입력하세요:');
  if (oldPwd === null) return;
  if (oldPwd !== currentUser.password) {
    alert('현재 비밀번호가 일치하지 않습니다.');
    return;
  }
  const newPwd = prompt('새 비밀번호를 입력하세요 (4자 이상):');
  if (newPwd === null) return;
  if (!newPwd || newPwd.length < 4) {
    alert('비밀번호는 4자 이상이어야 합니다.');
    return;
  }
  const confirmPwd = prompt('새 비밀번호를 다시 입력하세요:');
  if (confirmPwd === null) return;
  if (newPwd !== confirmPwd) {
    alert('새 비밀번호가 일치하지 않습니다.');
    return;
  }
  const s = loadSettings();
  const staff = s.staff.find(u => u.id === currentUser.id);
  if (!staff) return;
  staff.password = newPwd;
  saveSettings(s);
  currentUser.password = newPwd;
  alert('비밀번호가 변경되었습니다.');
};
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

  appId: "1:540432014473:web:fda47bfb990fdcf775ba58"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 전역으로 노출 - dlRawData가 호출
window.__firestoreFetchAllResponses = async function() {
  try {
    const q = query(collection(db, 'responses'), orderBy('submittedAt', 'asc'));
    const snap = await getDocs(q);
    const responses = [];
    snap.forEach(doc => {
      responses.push({ _id: doc.id, ...doc.data() });
    });
    return responses;
  } catch (e) {
    console.error('[Firebase] 응답 가져오기 실패:', e);
    throw e;
  }
};

console.log('[Firebase] 관리자 페이지 초기화 완료. 학생 응답 자동 동기화.');
</script>
